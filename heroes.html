<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hou2Touch — Animated headers</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"H2T Bebas";src:url("fonts/h2t-bebas.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{
  --ink:#0b0b0c; --ink2:#141416; --paper:#e9e7e0; --paper2:#dcd9d0;
  --mute:#8e8c85; --line:#26262a; --hou:#e5501e;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,monospace;
  --disp:"H2T Bebas",Impact,"Arial Narrow",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

.app{display:flex;flex-direction:column;height:100dvh;padding:14px clamp(12px,2.4vw,34px) 12px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:700 20px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand span{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.bar-r{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px}
.tabs button{height:26px;padding:0 11px;border-radius:999px;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);transition:.16s;white-space:nowrap}
.tabs button:hover{color:var(--paper)}
.tabs button.on{background:var(--paper);color:var(--ink)}
.tabs b{font-weight:600;opacity:.55;margin-left:6px}
.count{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--paper);font-weight:600}
.ibtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);transition:.18s}
.ibtn:hover{color:var(--paper);border-color:#3a3a40}
.ibtn[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.ibtn svg{width:9px;height:9px;fill:currentColor}

/* stage */
.main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:clamp(10px,2vh,26px) 0 0}
.frame{width:100%;max-width:1760px;margin:0 auto}
.stage{width:100%;display:flex;align-items:center;justify-content:center}
.band{position:relative;background:#0e0e10;overflow:hidden;border:1px solid var(--line);border-radius:2px;touch-action:pan-y}
.band canvas{display:block;width:100%;height:100%}
.band.is-page{background:#e9e7e0}
.hlogo{position:absolute;left:3.8%;right:3.8%;top:0;font-family:var(--disp);font-weight:400;line-height:.82;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;user-select:none;pointer-events:none;
  text-shadow:6px 0 0 var(--paper),-6px 0 0 var(--paper),0 6px 0 var(--paper),0 -6px 0 var(--paper),4.2px 4.2px 0 var(--paper),-4.2px 4.2px 0 var(--paper),4.2px -4.2px 0 var(--paper),-4.2px -4.2px 0 var(--paper),3.5px 1.5px 0 var(--paper),-3.5px 1.5px 0 var(--paper),3.5px -1.5px 0 var(--paper),-3.5px -1.5px 0 var(--paper),1.5px 3.5px 0 var(--paper),-1.5px 3.5px 0 var(--paper),1.5px -3.5px 0 var(--paper),-1.5px -3.5px 0 var(--paper)}
.chip{position:absolute;top:8px;z-index:4;background:rgba(11,11,12,.82);color:var(--paper);padding:4px 9px;border-radius:2px;font:500 10px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;backdrop-filter:blur(4px)}
.chip.l{left:8px}
.chip.r{right:8px;color:var(--mute)}

/* live page cover */
.pwrap{position:absolute;inset:0;display:none;background:#e9e7e0}
.band.is-page .pwrap{display:block}
.band.is-page canvas,.band.is-page .hlogo,.band.is-page .chip{display:none}
.pwrap iframe{position:absolute;top:0;left:0;width:1440px;height:900px;border:0;transform-origin:0 0;background:#e9e7e0;display:block}
.pwrap::after{content:"";position:absolute;inset:0;cursor:default}
.pwrap.loading::before{content:"loading cover…";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#6b6a64}
.pwrap.loading{background:#e9e7e0}

/* prev / next */
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:clamp(34px,4vw,56px);height:clamp(34px,4vw,56px);border-radius:50%;display:grid;place-items:center;
  background:rgba(11,11,12,.62);color:var(--paper);box-shadow:inset 0 0 0 1px rgba(233,231,224,.28);backdrop-filter:blur(6px);transition:.18s}
.nav:hover{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--paper)}
.nav:active{transform:translateY(-50%) scale(.94)}
.nav.prev{left:clamp(6px,1vw,16px)}
.nav.next{right:clamp(6px,1vw,16px)}
.nav svg{width:34%;height:34%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* caption */
.cap{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-top:14px}
.cap-l{min-width:0}
.kicker{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--hou);display:inline-block}
h1{font:700 clamp(21px,2.5vw,38px)/.96 var(--disp);text-transform:uppercase;letter-spacing:.01em;color:var(--paper);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.sub{font:400 12px/1.5 var(--sans);color:var(--mute);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub code{font:500 11px/1 var(--mono);letter-spacing:.04em;color:#a5a29a}
.cap-r{display:flex;align-items:center;gap:12px;flex:none}
.openlink{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:2px;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none;transition:.16s;white-space:nowrap}
.openlink:hover{color:var(--paper);border-color:#3a3a40}
.openlink[hidden]{display:none}
.selwrap{position:relative}
.selwrap::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1px solid var(--mute);border-bottom:1px solid var(--mute);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{appearance:none;height:34px;padding:0 32px 0 12px;border:1px solid var(--line);border-radius:2px;background:var(--ink2);font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--paper);max-width:min(46vw,360px)}
select:focus{outline:none;border-color:var(--paper)}

/* progress + rail */
.prog{width:100%;margin:12px 0 0;height:2px;background:var(--line);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--paper);transition:width .25s ease}
.rail{width:100%;margin:10px 0 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:2px;font:500 10px/1 var(--mono);letter-spacing:.06em;color:var(--mute);text-transform:uppercase;transition:.16s}
.rail button:hover{color:var(--paper);border-color:#3a3a40}
.rail button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

.foot{display:flex;justify-content:space-between;gap:16px;padding-top:10px;font:500 9.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#5d5b57}
.foot kbd{font:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:2px 5px;color:var(--mute)}
.swap .hlogo,.swap h1,.swap .sub{animation:sw .3s ease}
@keyframes sw{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

@media (max-width:760px){
  .app{padding:10px 12px 8px}
  .brand{display:none}
  .main{padding-top:10px}
  .cap{flex-direction:column;align-items:stretch;gap:10px}
  .cap-r{justify-content:space-between}
  select{max-width:none;flex:1}
  h1{font-size:clamp(20px,6vw,28px)}
  .sub{display:none}
  .foot span:last-child{display:none}
  .rail{margin-top:8px}
  .ibtn span{display:none}
  .ibtn{padding:0 11px}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><b>Hou2Touch</b><span>animated covers &middot; all headers</span></div>
    <div class="tabs" id="tabs">
      <button data-tab="pages" class="on">Pages<b>33</b></button>
      <button data-tab="series">Series<b>64</b></button>
    </div>

      <button class="ibtn" id="play" aria-pressed="false"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg><span>Play</span></button>

  <div class="main" id="main">

          <button class="nav next" id="next" aria-label="Next header"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

      <div class="cap" id="cap">

          <div class="kicker"><i></i><span id="kick">pages · en</span> &middot; <span id="cname">start page</span></div>

        <div class="cap-r">
          <a class="openlink" id="open" href="#" target="_blank" rel="noopener">Open page &#8599;</a>

      </div>

      <div class="prog"><i id="fill"></i></div>
      <div class="rail" id="rail"></div>

  </div>

  <div class="foot">
    <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> browse &middot; wheel &amp; swipe &middot; pages are live, series follow the cursor</span>
    <span id="fps">webgl &middot; 1600 &times; 500</span>
  </div>
</div>

<script>
const U2G_BODY = "#ifdef UP2\nuniform vec4 QP,QW;uniform vec2 QY;uniform vec3 QS1,QS2;uniform float QT,QN,QA;\n#if defined(UP4)||defined(UP5)\nuniform vec4 KA[8],KB[8],KC[8];   /* \u043a\u043e\u043b\u043b\u0430\u0436: KA \u2014 \u0446\u0435\u043d\u0442\u0440 (\u0434\u043e\u043b\u0438 \u0448\u0438\u0440\u0438\u043d\u044b / \u043f\u043e\u043b\u043e\u0441\u044b) \u0438 \u0440\u0430\u0437\u043c\u0435\u0440 (\u0434\u043e\u043b\u0438 \u0448\u0438\u0440\u0438\u043d\u044b / \u043f\u043e\u043b\u043e\u0441\u044b), KB \u2014 \u043f\u043e\u0432\u043e\u0440\u043e\u0442 (\u0440\u0430\u0434), \u0444\u0430\u043a\u0442\u0443\u0440\u0430; KC \u2014 \u043c\u0430\u0441\u0448\u0442\u0430\u0431 \u043e\u0442\u0442\u0438\u0441\u043a\u0430, \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a \u043d\u0430 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0435 (\u0434\u043e\u043b\u0438 \u0448\u0438\u0440\u0438\u043d\u044b / \u043f\u043e\u043b\u043e\u0441\u044b) */\n#endif\n#ifndef U2T\n#define U2T(c) texture2D(T,clamp((c)/R,0.,1.))\n#endif\n/* \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u044b\u0435 \u043f\u0440\u0430\u0432\u043a\u0438 \u043f\u043e \u0440\u0430\u0437\u0431\u043e\u0440\u0443 \u043f\u0430\u0440\u044b (26.10): \u0441\u0442\u0440\u043e\u043a\u0430 \u2014 \u043e\u0441\u044c \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u043f\u0435\u0440\u0438\u043e\u0434\u0430, \u0442\u043e\u043b\u0449\u0438\u043d\u0430 \u2265 1,25 px, \u043a\u0440\u0430\u0439 \u2014 1 px \u0441\u0433\u043b\u0430\u0436\u0438\u0432\u0430\u043d\u0438\u044f (\u0445\u043e\u043b\u0441\u0442 \u0432 CSS-\u043f\u0438\u043a\u0441\u0435\u043b\u044f\u0445:\n   \u0442\u043e\u043d\u044c\u0448\u0435 \u043f\u0438\u043a\u0441\u0435\u043b\u044f \u0441\u0442\u0440\u043e\u043a\u0438 \u0440\u0432\u0430\u043b\u0438\u0441\u044c \u0432 \u00ab\u043c\u043e\u0440\u0437\u044f\u043d\u043a\u0443\u00bb); \u043f\u043e\u0440\u043e\u0433 \u0444\u0438\u0433\u0443\u0440\u044b \u2014 \u0436\u0451\u0441\u0442\u043a\u0438\u0439, \u0441 \u0431\u0 n      for(int k=0;k<4;k++){\n        float y0=top+hb*(.16+float(k)*.22),yTarget= mix(y0,focus.y,pow(t,1.4)) + sin(x*.02-QT*3.+float(k))*hb*.04*(1.-t);\n        if(abs(cC.y-yTarget)<G*1.1)hit=1.;\n      }\n      o=mix(o,hit>.5?CG:INK,hit>.5?step(max(abs(cL.x),abs(cL.y)),G*.40):step(length(cL),1.8));\n    }else{\n      vec2 d=cC-focus;float ang=atan(d.y,d.x);\n      float beam=cos(ang*7.+sin(scP*2.));\n      vec2 rDir=normalize(d+1e-4);\n      float vLn=clamp(2.0-u5sg(cL,-rDir*G*.42,rDir*G*.42),0.,1.);\n      o=mix(o,beam>.35?CR:INK,max(vLn,step(length(cL),beam>.35?3.4:1.8)));\n    }\n\n    #else\n    /* GLSL \u00b7 \u0418\u043d\u0442\u0435\u0440\u0430\u043a\u0442\u0438\u0432\u043d\u0430\u044f \u0438\u0437\u043e\u043c\u0435\u0442\u0440\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0432\u043e\u043a\u0441\u0435\u043b\u044c\u043d\u0430\u044f \u043b\u0435\u0441\u0442\u043d\u0438\u0446\u0430 \u0448\u0435\u0439\u0434\u0435\u0440\u0430 \u043d\u0430 \u0441\u0435\u0442\u043a\u0435 */\n    vec3 CV=QS1;\n    float colIdx=floor(x/36.),rowIdx=floor((yt-top)/18.);\n    float targetR=6.*(.5+.5*sin(colIdx*.35-QT*1.8+scP*2.5))+4.*exp(-abs(colIdx*36.-M0.x)/180.);\n    bool onStair=abs(rowIdx-targetR)<2.2;\n    vec2 vD=vec2(.866,-.5);\n    float vLn=clamp(1.8-u5sg(cL,-vD*G*.38,vD*G*.38),0.,1.);\n    if(onStair){\n      o=mix(o,mod(colIdx+rowIdx,2.)<.5?CV:INK,step(max(abs(cL.x),abs(cL.y)),G*.42));\n    }else{\n      o=mix(o,INK,max(vLn*.45,step(length(cL),2.)));\n    }\n    #endif\n    float bdr=max(clamp(1.5-abs(yt-top),0.,1.),clamp(1.5-abs(yt-bot),0.,1.));o=mix(o,INK,bdr*.75);\n    return o*(1.-.035*(pk(floor(fc*.5)+3.)-.5));\n  }\n  #endif\n  #ifdef UP21\n  /* \u041f\u0410\u041a 5 (?x=up21) \u2014 \u00ab\u0421\u041f\u041b\u0415\u0422\u0415\u041d\u0418\u0415 \u041d\u0418\u0422\u0415\u0419, \u0413\u0418\u041f\u0415\u0420\u0411\u041e\u041b\u041e\u0418\u0414 \u0418 \u041b\u0418\u0421\u0421\u0410\u0416\u0423 2.0\u00bb (\u0438\u0437 \u2116 223 \u0421\u043f\u043b\u0435\u0442\u0435\u043d\u0438\u0435, \u041d\u0438\u0442\u0435\u0439 \u0438 \u0428\u043b\u044e\u0437\u0430 \u041b\u0438\u0441\u0441\u0430\u0436\u0443):\n     \u041d\u0430 \u0441\u0432\u0435\u0442\u043b\u043e\u0439 \u0441\u0435\u0442\u043a\u0435 \u0442\u043e\u0447\u0435\u043a \u043d\u0430\u0442\u044f\u043d\u0443\u0442\u044b \u0433\u0435\u043e\u0434\u0435\u0437\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0441\u0442\u0440\u0443\u043d\u044b, \u043b\u0438\u043d\u0435\u0439\u0447\u0430\u0442\u044b\u0435 \u0433\u0438\u043f\u0435\u0440\u0431\u043e\u043b\u043e\u0438\u0434\u044b \u0438 \u043e\u0440\u0431\u0438\u0442\u044b \u041b\u0438\u0441\u0441\u0430\u0436\u0443, \u043f\u0435\u0440\u0435\u043f\u043b\u0435\u0442\u0430\u0435\u043c\u044b\u0435 \u043a\u0443\u0440\u0441\u043e\u0440\u043e\u043c! */\n  { vec2 P=vec2(x,yt),M0=QM.xy;float mh=QM.z,scP=QM.w,st=QU.z,xc=QZ.x;vec3 o=PAP;\n    float G=18.;vec2 cI=floor(P/G),cC=(cI+.5)*G,cL=P-cC,gf=fract(P/G);\n    float gLn=max(step(gf.x,1./G),step(gf.y,1./G))*.18;\n    o=mix(PAP,INK,max(gLn,step(length(cL),1.6)*.55));\n    vec2 toM=P-M0;float rM=length(toM),mTwist=exp(-rM/(hb*.45))*(1.4+.6*mh);\n    #if U5M==0\n    /* EXTREME I \u00b7 \u0421\u043f\u043b\u0435\u0442\u0435\u043d\u0438\u0435 \u0437\u0432\u0443\u043a\u043e\u0432\u044b\u0445 \u043f\u0440\u044f\u0434\u0435\u0439 (\u2116 223 \u00d7 4 \u0436\u0433\u0443\u0442\u0430 CHOP): \u0443\u043f\u0440\u0443\u0433\u0438\u0435 \u043f\u0443\u0447\u043a\u0438 \u0441\u0442\u0440\u0443\u043d \u0441\u043f\u043b\u0435\u0442\u0430\u044e\u0442\u0441\u044f \u0432\u043e\u043a\u0440\u0443\u0433 \u043a\u0443\u0440\u0441\u043e\u0440\u0430 */\n    vec3 CG=QS1;\n    float yRel=(yt-(top+hb*.48))/hb + (toM.y/hb)*mTwist*.45;\n    float b1=sin(x/(hb*.38)-QT*1.8+scP*2.)*.28,b2=-sin(x/(hb*.34)+QT*1.5-scP*1.5)*.26;\n    float d1=abs(yRel-b1),d2=abs(yRel-b2);\n    float s1=u2ln((yRel-b1)*hb/6.5,.44,6.5)*step(d1,.16);\n    float s2=u2ln((yRel-b2)*hb/6.5,.44,6.5)*step(d2,.16);\n    if(d1<.16&&d2<.16){\n      /* \u0423\u0437\u0435\u043b \u043f\u0435\u0440\u0435\u0445\u043b\u0451\u0441\u0442\u0430 \u0434\u0432\u0443\u0445 \u0436\u0433\u0443\u0442\u043e\u0432 */\n      o=mix(o,INK,max(s1,s2));\n      o=mix(o,CG,step(length(cL),3.4));\n    }else if(d1<.16){\n      o=mix(o,CG,s1);\n    }else if(d2<.16){\n      o=mix(o,INK,s2);\n    }\n\n    #elif U5M==1\n    /* EXTREME II \u00b7 \u041b\u0438\u043d\u0435\u0439\u0447\u0430\u0442\u044b\u0439 \u0433\u0438\u043f\u0435\u0440\u0431\u043e\u043b\u043e\u0438\u0434 \u0438\u0437 \u043f\u0440\u044f\u043c\u044b\u0445 \u043b\u0430\u0437\u0435\u0440\u043d\u044b\u0445 \u0441\u0442\u0440\u0443\u043d (\u00ab\u041d\u0438\u0442\u0438\u00bb \u2116 125/602), \u0444\u043e\u043a\u0443\u0441 \u0441\u043a\u0440\u0443\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0437\u0430 \u043a\u0443\u0440\u0441\u043e\u0440\u043e\u043c M0 */\n    vec3 CR=QS1;\n    vec2 C0=mix(vec2(R.x*.58,top+hb*.48),M0,.45);\n    float hitInk=0.,hitRed=0.,nodes=0.;\n    for(int i=0;i<24;i++){\n      float fi=float(i)/24.,a=fi*6.2831853+QT*.35+scP*.8;\n      float twist=2.1+.6*sin(QT*.5)+mTwist*.8;\n      vec2 A=C0+vec2(cos(a)*hb*.95,-hb*.46),B=C0+vec2(cos(a+twist)*hb*.95,hb*.46);\n      float d=u5sg(P,A,B);\n      if(mod(float(i),3.)<.5)hitRed=max(hitRed,clamp(1.85-d,0.,1.));\n      else hitInk=max(hitInk,clamp(1.65-d,0.,1.));\n      nodes=max(nodes,step(length(P-A),3.5)+step(length(P-B),3.5));\n    }\n    o=mix(o,INK,hitInk);\n    o=mix(o,CR,max(hitRed,nodes));\n\n    #elif U5M==2\n    /* \u041f\u0410\u041a\u0415\u0422 I + II \u00b7 \u0414\u0432\u043e\u0439\u043d\u0430\u044f \u0433\u0430\u0440\u043c\u043e\u043d\u0438\u043a\u0430 \u041b\u0438\u0441\u0441\u0430\u0436\u0443 (A3 \u00ab\u0428\u043b\u044e\u0437\u00bb): \u0437\u0435\u043b\u0451\u043d\u0430\u044f \u0438 \u043a\u0430\u0440\u043c\u0438\u043d\u043d\u0430\u044f \u0444\u0430\u0437\u043e\u0432\u044b\u0435 \u043b\u0435\u043d\u0442\u044b \u043d\u0430 \u0441\u0435\u0442\u043a\u0435 \u0441 \u043e\u0431\u0449\u0438\u043c \u0443\u0437\u043b\u043e\u043c \u0443 \u043a\u0443\u0440\u0441\u043e\u0440\u0430 */\n    vec3 CG=QS1,CR=QS2;\n    vec2 p=(P-mix(vec2(xc*.85,top+hb*.48),M0,.35))/hb;\n    float liss1=abs(p.y-.34*sin(p.x*2.8+QT*1.6+scP*2.)*cos(p.x*1.4-QT*.9));\n    float liss2=abs(p.y-.34*cos(p.x*2.4-QT*1.4-scP*2.)*sin(p.x*1.8+QT*1.1));\n    float f1=u2ln(liss1*hb/6.,.45,6.)*step(liss1,.15);\n    float f2=u2ln(liss2*hb/6.,.45,6.)*step(liss2,.15);\n    o=mix(o,CG,f1);\n    o=mix(o,CR,f2);\n    if(liss1<.15&&liss2<.15)o=mix(o,INK,step(length(cL),3.6));\n\n    #else\n    /* GLSL \u00b7 \u0413\u0435\u043e\u0434\u0435\u0437\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043a\u0430\u0440\u043a\u0430\u0441 3D-\u0442\u043e\u0440\u0430 \u043d\u0430 \u0441\u0435\u0442\u043a\u0435 \u0441 \u0434\u0435\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0435\u0439 \u0432\u0435\u0440\u0448\u0438\u043d \u043e\u0442 \u043a\u0443\u0440\u0441\u043e\u0440\u0430 */\n    vec3 CV=QS1;\n    vec2 C0=mix(vec2(R.x*.60,top+hb*.48),M0,.38);\n    vec2 dp=(P-C0)/hb;\n    float r=length(dp),ang=atan(dp.y,dp.x);\n    /* \u041f\u0440\u043e\u0435\u043a\u0446\u0438\u044f \u043c\u0435\u0440\u0438\u0434\u0438\u0430\u043d\u043e\u0432 \u0438 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u0435\u0439 \u0442\u043e\u0440\u0430 */\n    float uTor=ang*6.+QT*1.2+scP*2.,vTor=(r-.34)*22.-QT*2.;\n    float m1=clamp(1.5-abs(fract(uTor/3.14159+vTor*.2)-.5)*14.,0.,1.);\n    float m2=clamp(1.5-abs(fract(uTor/3.14159-vTor*.2)-.5)*14.,0.,1.);\n    bool inRing=abs(r-.34)<.22;\n    if(inRing){\n      o=mix(o,CV,m1);\n      o=mix(o,INK,m2);\n      if(m1>.4&&m2>.4)o=mix(o,INK,step(length(cL),3.4));\n    }\n    #endif\n    float bdr=max(clamp(1.5-abs(yt-top),0.,1.),clamp(1.5-abs(yt-bot),0.,1.));o=mix(o,INK,bdr*.75);\n    return o*(1.-.035*(pk(floor(fc*.5)+3.)-.5));\n  }\n  #endif\n  #ifdef UP22\n  /* \u041f\u0410\u041a 6 (?x=up22) \u2014 \u00ab\u0414\u041e\u041c\u0415\u041d\u042b \u0412\u041e\u0420\u041e\u041d\u041e\u0413\u041e \u0418 \u041c\u0410\u0413\u041d\u0418\u0422\u041d\u0410\u042f \u041c\u041e\u0417\u0410\u0418\u041a\u0410 2.0\u00bb (\u0438\u0437 \u2116 182 \u0412\u0435\u043d\u0435\u0446\u043a\u0438, \u0414\u043e\u043c\u0435\u043d\u043e\u0432 GLSL, \u2116 537 \u0438 A2 \u041c\u0430\u0433\u043d\u0438\u0442):\n     \u0421\u0432\u0435\u0442\u043b\u0430\u044f \u0441\u0435\u0442\u043a\u0430 \u0442\u043e\u0447\u0435\u043a \u0438 \u0432\u0435\u043a\u0442\u043e\u0440\u043e\u0432 \u0440\u0430\u0437\u0431\u0438\u0442\u0430 \u043d\u0430 \u0436\u0438\u0432\u044b\u0435 \u044f\u0447\u0435\u0439\u043a\u0438 \u0412\u043e\u0440\u043e\u043d\u043e\u0433\u043e; \u043a\u0443\u0440\u0441\u043e\u0440 \u0438 \u0441\u043a\u0440\u043e\u043b\u043b \u0434\u0432\u0438\u0433\u0430\u044e\u0442 \u0446\u0435\u043d\u0442\u0440\u044b \u0434\u043e\u043c\u0435\u043d\u043e\u0432 \u0438 \u043c\u0435\u043d\u044f\u044e\u0442 \u0438\u0445 \u0444\u0438\u0437\u0438\u043a\u0443! */\n  { vec2 P=vec2(x,yt),M0=QM.xy;float mh=QM.z,scP=QM.w,st=QU.z,xc=QZ.x;vec3 o=PAP;\n    float G=16.;vec2 cI=floor(P/G),cC=(cI+.5)*G,cL=P-cC,gf=fract(P/G);\n    float S=hb*.32;vec2 gv=P/S,iv=floor(gv),fv=fract(gv);\n    float d1=8.,d2=8.;vec2 id1=vec2(0.),ctr1=vec2(0.);\n    for(int y=-1;y<=1;y++)for(int x0=-1;x0<=1;x0++){\n      vec2 nb=vec2(float(x0),float(y)),id=iv+nb;\n      vec2 h=vec2(pk(id*1.3+1.1),pk(id*2.7+3.3));\n      vec2 pt=nb+.5+.36*sin(h*6.28318+QT*.5+scP*1.2);\n      vec2 wPt=(iv+pt)*S;\n      /* \u0426\u0435\u043d\u0442\u0440\u044b \u0434\u043e\u043c\u0435\u043d\u043e\u0432 \u043f\u0440\u0438\u0442\u044f\u0433\u0438\u0432\u0430\u044e\u0442\u0441\u044f/\u043e\u0442\u0442\u0430\u043b\u043a\u0438\u0432\u0430\u044e\u0442\u0441\u044f \u043a\u0443\u0440\u0441\u043e\u0440\u043e\u043c M0 */\n      vec2 mD=wPt-M0;wPt+=normalize(mD+1e-3)*exp(-length(mD)/(hb*.45))*hb*.12;\n      float d=length(P-wPt)/S;\n      if(d<d1){d2=d1;d1=d;id1=id;ctr1=wPt;}else if(d<d2){d2=d;}\n    }\n    float edge=(d2-d1)*S;\n    float domH=pk(id1*3.7+5.);\n    bool nearM=length(ctr1-M0)<hb*.38;\n    #if U5M==0\n    /* EXTREME I \u00b7 \u041c\u0430\u0433\u043d\u0438\u0442\u043d\u043e-\u0430\u043a\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0434\u043e\u043c\u0435\u043d\u044b (A2 \u041c\u0430\u0433\u043d\u0438\u0442 \u00d7 \u2116 537): \u0432 \u043e\u0434\u043d\u0438\u0445 \u0434\u043e\u043c\u0435\u043d\u0430\u0445 \u2014 \u043c\u0430\u0442\u0440\u0438\u0446\u0430 \u0442\u043e\u0447\u0435\u043a, \u0432 \u0434\u0440\u0443\u0433\u0438\u0445 \u2014 \u0438\u0433\u043e\u043b\u043a\u0438 \u043f\u043e\u043b\u044f \u043a \u044f\u0434\u0440\u0443 */\n    vec3 CG=QS1;\n    if(domH>.55||nearM){\n      float rDot=1.5+3.2*step(.4,pk(cI+floor(QT*2.)));\n      o=mix(PAP,nearM?CG:INK,smoothstep(rDot+.6,rDot-.6,length(cL)));\n    }else{\n      vec2 dir=normalize(ctr1-cC+1e-4);\n      float vLn=clamp(1.9-u5sg(cL,-dir*G*.38,dir*G*.38),0.,1.);\n      o=mix(PAP,CG,vLn);\n      o=mix(o,INK,step(length(cL),1.8));\n    }\n    o=mix(o,INK,clamp(2.0-edge,0.,1.));\n    o=mix(o,CG,step(length(P-ctr1),4.5));\n\n    #elif U5M==1\n    /* EXTREME II \u00b7 \u041e\u043f\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u043c\u043e\u0437\u0430\u0438\u043a\u0430 \u0412\u0435\u043d\u0435\u0446\u043a\u0438 (\u2116 182): \u0432 \u043a\u0430\u0436\u0434\u043e\u043c \u0434\u043e\u043c\u0435\u043d\u0435 \u0441\u0432\u043e\u0439 \u0443\u0433\u043e\u043b \u0432\u0435\u043a\u0442\u043e\u0440\u043d\u043e\u0439 \u043b\u0430\u0437\u0435\u0440\u043d\u043e\u0439 \u0440\u0435\u0448\u0451\u0442\u043a\u0438 \u0438 \u0448\u0430\u0433 \u0442\u043e\u0447\u0435\u043a */\n    vec3 CR=QS1;\n    float ang=floor(domH*6.)*.5236 + (nearM?scP:.0);\n    vec2 dir=vec2(cos(ang),sin(ang));\n    float vLn=clamp(2.0-u5sg(cL,-dir*G*.42,dir*G*.42),0.,1.);\n    if(domH>.62||nearM){\n      o=mix(PAP,CR,max(vLn,step(length(cL),3.2)));\n    }else if(domH>.3){\n      o=mix(PAP,INK,step(length(cL),1.6+2.4*domH));\n    }else{\n      o=mix(PAP,INK,vLn);\n    }\n    o=mix(o,INK,clamp(2.2-edge,0.,1.));\n\n    #elif U5M==2\n    /* \u041f\u0410\u041a\u0415\u0422 I + II \u00b7 \u0414\u0432\u0443\u0445\u0444\u0430\u0437\u043d\u044b\u0439 \u0430\u0442\u043b\u0430\u0441 \u0434\u043e\u043c\u0435\u043d\u043e\u0432: \u0437\u0435\u043b\u0451\u043d\u044b\u0435 \u0434\u043e\u043c\u0435\u043d\u044b I (\u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0430\u0442\u0440\u0438\u0446\u0430) \u0438 \u043a\u0430\u0440\u043c\u0438\u043d\u043d\u044b\u0435 \u0434\u043e\u043c\u0435\u043d\u044b II (\u0432\u0435\u043a\u0442\u043e\u0440\u043d\u044b\u0439 \u0432\u0435\u0435\u0440) */\n    vec3 CG=QS1,CR=QS2;\n    bool isII=(ctr1.x>mix(xc,M0.x,.5))||(domH>.68);\n    vec2 dir=normalize(ctr1-cC+1e-4);\n    float vLn=clamp(2.0-u5sg(cL,-dir*G*.40,dir*G*.40),0.,1.);\n    if(isII){\n      o=mix(PAP,CR,max(vLn,step(length(cL),2.4)));\n    }else{\n      float rD=1.8+2.6*step(.45,pk(cI));\n      o=mix(PAP,CG,smoothstep(rD+.6,rD-.6,length(cL)));\n      o=mix(o,INK,max(step(gf.x,1./G),step(gf.y,1./G))*.25);\n    }\n    o=mix(o,INK,clamp(2.2-edge,0.,1.));\n\n    #else\n    /* GLSL \u00b7 \u0428\u0435\u0439\u0434\u0435\u0440 \u00ab\u0414\u043e\u043c\u0435\u043d\u044b 2.0\u00bb (Voronoi + Isolines + Vector Normals \u043d\u0430 \u0441\u0432\u0435\u0442\u043b\u043e\u0439 \u0441\u0435\u0442\u043a\u0435) */\n    vec3 CV=QS1;\n    float iso=clamp(1.5-abs(fract(d1*6.-QT*.5+scP)-.5)*12.,0.,1.);\n    vec2 dir=normalize(P-ctr1+1e-4);\n    float vLn=clamp(1.8-u5sg(cL,-dir*G*.36,dir*G*.36),0.,1.);\n    o=mix(PAP,domH>.5||nearM?CV:INK,max(iso*.75,vLn));\n    o=mix(o,INK,step(length(cL),2.2));\n    o=mix(o,INK,clamp(2.2-edge,0.,1.));\n    #endif\n    float bdr=max(clamp(1.5-abs(yt-top),0.,1.),clamp(1.5-abs(yt-bot),0.,1.));o=mix(o,INK,bdr*.75);\n    return o*(1.-.035*(pk(floor(fc*.5)+3.)-.5));\n  }\n  #endif\n  #ifdef UP14\n  /* \u0421\u0415\u0420\u0418\u042f G (?x=up14) \u2014 \u00ab\u0418\u041d\u0422\u0415\u0420\u0410\u041a\u0422\u0418\u0412\u041d\u041e\u0415 \u041f\u041e\u041b\u0415 \u0412\u0415\u041a\u0422\u041e\u0420\u041e\u0412, \u041c\u0410\u042f\u0422\u041d\u0418\u041a\u041e\u0412 \u0418 \u0414\u0418\u041f\u041e\u041b\u0415\u0419 \u041d\u0410 \u0421\u0412\u0415\u0422\u041b\u041e\u041c \u0424\u041e\u041d\u0415\u00bb (\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043d\u0430 \u043c\u044b\u0448\u044c, \u0442\u0430\u0447 \u0438 \u0441\u043a\u0440\u043e\u043b\u043b \u0447\u0435\u0440\u0435\u0437 QM):\n     U5M=0 (Extreme I): \u0423\u043f\u0440\u0443\u0433\u0430\u044f \u043c\u0430\u0442\u0440\u0438\u0446\u0430 \u0437\u0432\u0443\u043a\u043e\u0432\u044b\u0445 \u043c\u0430\u044f\u0442\u043d\u0438\u043a\u043e\u0432 (\u0442\u043e\u0447\u043a\u0430-\u044f\u043a\u043e\u0440\u044c + \u043e\u0442\u043a\u043b\u043e\u043d\u0451\u043d\u043d\u044b\u0439 \u0432\u0435\u043a\u0442\u043e\u0440 + \u0433\u043e\u043b\u043e\u0432\u043a\u0430 \u043f\u0435\u0440\u0435\u043c\u0435\u043d\u043d\u043e\u0433\u043e \u0434\u0438\u0430\u043c\u0435\u0442\u0440\u0430).\n     U5M=1 (Extreme II): \u041a\u0438\u043d\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0440\u0435\u0448\u0451\u0442\u043a\u0430 \u0437\u0435\u0440\u043a\u0430\u043b-\u0433\u0430\u043b\u044c\u0432\u0430\u043d\u043e\u043c\u0435\u0442\u0440\u043e\u0432, \u043f\u043e\u0432\u043e\u0440\u0430\u0447\u0438\u0432\u0430\u044e\u0449\u0438\u0445\u0441\u044f \u0437\u0430 \u043a\u0443\u0440\u0441\u043e\u0440\u043e\u043c \u0438 \u0431\u0440\u043e\u0441\u0430\u044e\u0449\u0438\u0445 \u043b\u0430\u0437\u0435\u0440\u043d\u0443\u044e \u043a\u0430\u0443\u0441\u0442\u0438\u043a\u0443.\n     U5M=2 (\u041f\u0430\u043a\u0435\u0442 I+II): \u0414\u0432\u0443\u0445\u043f\u043e\u043b\u044f\u0440\u043d\u0430\u044f \u0434\u0438\u043f\u043e\u043b\u044c\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 (\u0437\u0435\u043b\u0451\u043d\u043e-\u043a\u0430\u0440\u043c\u0438\u043d\u043d\u044b\u0435 \u043a\u043e\u043c\u043f\u0430\u0441\u044b + \u0441\u0438\u043b\u043e\u0432\u044b\u0435 \u043b\u0438\u043d\u0438\u0438 \u043c\u0435\u0436\u0434\u0443 \u043f\u043e\u043b\u044e\u0441\u0430\u043c\u0438 \u0438 \u043a\u0443\u0440\u ,yt),M0=QM.xy;float mh=QM.z,scP=QM.w,st=QU.z,xc=QZ.x;vec3 o=PAP;\n    vec2 toM=P-M0;float rM=length(toM);\n    /* \u0423\u043f\u0440\u0443\u0433\u043e\u0435 \u0440\u0430\u0434\u0438\u0430\u043b\u044c\u043d\u043e-\u0432\u0438\u0445\u0440\u0435\u0432\u043e\u0435 \u0441\u043c\u0435\u0449\u0435\u043d\u0438\u0435 \u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0441\u0442\u0432\u0430 \u0432\u043e\u043a\u0440\u0443\u0433 \u043a\u0443\u0440\u0441\u043e\u0440\u0430/\u0442\u0430\u0447\u0430 \u0438 \u0432\u043e\u043b\u043d\u044b \u0441\u043a\u0440\u043e\u043b\u043b\u0430 */\n    float pinch=exp(-rM/(hb*.38))*(hb*.16)*(1.+.5*mh)*cos(rM/(hb*.12)-QT*3.+scP*4.);\n    vec2 Pw=P + (toM/(rM+12.))*pinch + vec2(0.,sin(x/(hb*.28)-QT*1.8+scP*2.5)*hb*.045);\n    #if U5M==0\n    vec3 CG=QS1;\n    /* \u0423\u043f\u0440\u0443\u0433\u0430\u044f \u043c\u0435\u043c\u0431\u0440\u0430\u043d\u0430 \u0438\u0437 \u0441\u0442\u0440\u0443\u043d \u0438 \u043a\u0430\u043b\u0438\u0431\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0445 \u0442\u043e\u0447\u0435\u043a (14 px) \u043d\u0430 \u0441\u0432\u0435\u0442\u043b\u043e\u043c \u0444\u043e\u043d\u0435 */\n    float G=st>.5?12.:15.;\n    vec2 gF=fract(Pw/G),gI=floor(Pw/G),gL=(gF-.5)*G;\n    /* \u0421\u0442\u0440\u0443\u043d\u044b \u043f\u043e X \u0438 Y + \u043a\u0440\u0443\u0433\u043b\u0430\u044f \u0442\u043e\u0447\u043a\u0430 \u0432 \u0443\u0437\u043b\u0435, \u0440\u0430\u0434\u0438\u0443\u0441 \u043a\u043e\u0442\u043e\u0440\u043e\u0439 \u0440\u0430\u0441\u0442\u0451\u0442 \u043e\u0442 \u043d\u0430\u0442\u044f\u0436\u0435\u043d\u0438\u044f \u043c\u0435\u043c\u0431\u0440\u0430\u043d\u044b */\n    float strX=clamp(1.25-abs(gL.y),0.,1.),strY=clamp(1.15-abs(gL.x),0.,1.)*.45;\n    float strain=clamp(abs(pinch)/(hb*.11)+.45*sin(gI.x*.25-QT*2.+scP*2.)*cos(gI.y*.3+QT),0.,1.);\n    float dotR=1.4+G*.34*strain;\n    float dotOn=smoothstep(dotR+.6,dotR-.6,length(gL));\n    o=mix(PAP,INK,max(strX*.65,strY));\n    o=mix(o,strain>.52?CG:INK,dotOn);\n    if(strain>.68&&length(gL)<dotR*.45)o=INK;\n\n    #elif U5M==1\n    vec3 CR=QS1;\n    /* \u0414\u0435\u0444\u043e\u0440\u043c\u0438\u0440\u0443\u0435\u043c\u0430\u044f \u0442\u0440\u0435\u0443\u0433\u043e\u043b\u044c\u043d\u0430\u044f \u0433\u0435\u043e\u0434\u0435\u0437\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u0435\u0442\u044c (\u0441\u0438\u043c\u043f\u043b\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430) \u043d\u0430 \u0441\u0432\u0435\u0442\u043b\u043e\u043c \u0444\u043e\u043d\u0435 */\n    float G=st>.5?22.:28.;\n    vec2 q=Pw/G;\n    /* \u041a\u043e\u0441\u043e\u0443\u0433\u043e\u043b\u044c\u043d\u044b\u0435 \u0431\u0430\u0440\u0438\u0446\u0435\u043d\u0442\u0440\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u043a\u043e\u043e\u0440\u0434\u0438\u043d\u0430\u0442\u044b \u0442\u0440\u0435\u0443\u0433\u043e\u043b\u044c\u043d\u043e\u0439 \u0440\u0435\u0448\u0451\u0442\u043a\u0438 */\n    vec2 sk=vec2(q.x-q.y*.57735,q.y*1.1547);\n    vec2 iS=floor(sk),fS=fract(sk);\n    float diag=abs(fS.x+fS.y-1.);\n    float dEdge=min(min(min(fS.x,1.-fS.x),min(fS.y,1.-fS.y)),diag*.7071)*G;\n    float dVert=min(min(length(fS),length(fS-vec2(1.,0.))),min(length(fS-vec2(0.,1.)),length(fS-vec2(1.,1.))))*G;\n    float tension=exp(-rM/(hb*.42))+.35*(.5+.5*sin(iS.x*.5-iS.y*.4-QT*2.+scP*3.));\n    /* \u0421\u0436\u0430\u0442\u044b\u0435 \u0433\u0440\u0430\u043d\u0438 \u0437\u0430\u043f\u043e\u043b\u043d\u044f\u044e\u0442\u0441\u044f \u0442\u043e\u043d\u043a\u043e\u0439 \u043b\u0430\u0437\u0435\u0440\u043d\u043e\u0439 \u0448\u0442\u0440\u0438\u0445\u043e\u0432\u043a\u043e\u0439 \u0438\u043b\u0438 \u043a\u0430\u0440\u043c\u0438\u043d\u043e\u043c */\n    if(tension>.72){\n      float hatch=u2ln((Pw.x+Pw.y)/5.,.38,5.);\n      o=mix(PAP,fS.x+fS.y<1.?CR:INK,hatch*.75);\n    }\n    o=mix(o,tension>.58?CR:INK,clamp(1.4-dEdge,0.,1.)*.85);\n    o=mix(o,CR,step(dVert,3.2));\n    o=mix(o,INK,step(dVert,1.8));\n\n    #elif U5M==2\n    vec3 CG=QS1,CR=QS2;\n    /* \u0414\u043 u041c\u0430\u0442\u0440\u0438\u0446\u0430 \u0444\u0430\u0437\u043e\u0432\u044b\u0445 \u043e\u0441\u0446\u0438\u043b\u043b\u044f\u0442\u043e\u0440\u043e\u0432 (\u043a\u043e\u043b\u044c\u0446\u043e + \u0441\u0442\u0440\u0435\u043b\u043a\u0430 \u0444\u0430\u0437\u044b + \u0441\u0438\u043d\u0445\u0440\u043e\u043d\u0438\u0437\u0430\u0446\u0438\u044f \u043e\u0442 \u043a\u0443\u0440\u0441\u043e\u0440\u0430 \u0438 \u0441\u043a\u0440\u043e\u043b\u043b\u0430).\n     U5M=1 (Extreme II): \u0418\u043d\u0442\u0435\u0440\u0430\u043a\u0442\u0438\u0432\u043d\u0430\u044f \u043b\u0430\u0437\u0435\u0440\u043d\u0430\u044f \u043a\u043e\u043c\u043c\u0443\u0442\u0430\u0446\u0438\u044f \u0422\u0440\u044e\u0448\u0435 (\u043a\u0443\u0440\u0441\u043e\u0440 \u0438 \u0441\u043a\u0440\u043e\u043b\u043b \u043f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0430\u044e\u0442 \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u044b \u043b\u0443\u0447\u0435\u0439 \u0432 \u044f\u0447\u0435\u0439\u043a\u0430\u0445).\n     U5M=2 (\u041f\u0430\u043a\u0435\u0442 I+II): \u0420\u0435\u0448\u0451\u0442\u043a\u0430 \u043a\u043b\u0435\u0442\u043e\u0447\u043d\u043e\u0433\u043e \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0430 (\u0437\u0435\u043b\u0451\u043d\u044b\u0435 \u043e\u0440\u0442\u043e\u0433\u043e\u043d\u0430\u043b\u0438 I \u00d7 \u043a\u0430\u0440\u043c\u0438\u043d\u043d\u044b\u0435 \u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u0438 II, \u0432\u043e\u0437\u0431\u0443\u0436\u0434\u0430\u0435\u043c\u044b\u0435 \u0441\u043b\u0435\u0434\u043e\u043c \u043c\u044b\u0448\u0438).\n     U5M=3 (GLSL): \u0410\u0434\u0430\u043f\u0442\u0438\u0432\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 \u0441\u0430\u0431\u0434\u0438\u0432\u0438\u0436\u0435\u043d\u0430 (64 \u2192 32 \u2192 16 \u2192 8 px), \u0434\u0440\u043e\u0431\u044f\u0449\u0430\u044f\u0441\u044f \u0432\u043e\u043a\u0440\u0443\u0433 \u043a\u0443\u0440\u0441\u043e\u0440\u0430 \u0438 \u0444\u0440\u043e\u043d\u0442\u0430 \u043f\u0440\u043e\u043a\u0440\u0443\u0442\u043 .:13.;vec2 iA=floor(P/sA),lA=P-(iA+.5)*sA;\n    float nA=max(clamp(1.4-u5sg(lA,-vDir*sA*.38,vDir*sA*.38),0.,1.),step(length(lA-vDir*sA*.38),2.2))*step(.28,pk(iA*2.3));\n    if(swarm>.58||min(r1,r2)<.085){\n      o=swarm>.78||min(r1,r2)<.045?INK:CR;\n      o=mix(o,PAP,nA*.85);\n    }else if(swarm>.20){\n      float prob=(swarm-.20)/.38;\n      o=dth<prob?(dth<prob*.5?INK:CR):PAP;\n      o=mix(o,CR,nA);\n    }else{\n      o=mix(PAP,mod(iA.x+iA.y,3.)<.5?CR:INK,nA*.9);\n    }\n\n    #elif U5M==2\n    /* \u041f\u0410\u041a\u0415\u0422 I + II \u00b7 \u0421\u0438\u043c\u0431\u0438\u043e\u0437 \u0434\u0432\u0443\u0445 \u043a\u043e\u043b\u043e\u043d\u0438\u0439 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0439 \u043c\u0430\u0442\u0435\u0440\u0438\u0438 (Green Physarum I \u00d7 Carmine Boid Swarm II):\n       \u0441\u043b\u0435\u0432\u0430 \u0432\u0435\u0442\u0432\u0438\u0442\u0441\u044f \u0437\u0435\u043b\u0451\u043d\u044b\u0439 \u043c\u0438\u043a\u0441\u043e\u043c\u0438\u0446\u0435\u0442 \u0437\u0432\u0443\u043a\u0430 I, \u0441\u043f\u0440\u0430\u0432\u0430 \u0430\u0442\u0430\u043a\u0443\u0435\u0442 \u0432\u0438\u0445\u0440\u0435\u0432\u043e\u0439 \u043a\u0430\u0440\u043c\u0438\u043d\u043d\u044b\u0439 \u0440\u043e\u0439 \u0441\u0432\u0435\u0442\u0430 II, \u043f\u043e \u0446\u0435\u043d\u0442\u0440\u0443 \u2014 \u0442\u0443\u0440\u0431\u0443\u043b\u0435\u043d\u0442\u043d\u044b\u0439 \u0444\u0440\u043e\u043d\u0442 \u0440\u0435\u0430\u043a\u0446\u0438\u0438 */\n    vec3 CG=QS1,CR=QS2;\n    vec2 u=(P-vec2(xc,top+hb*.48))/hb;\n    /* \u0422\u0443\u0440\u0431\u0443\u043b\u0435\u043d\u0442\u043d\u0430\u044f \u0433\u0440\u0430\u043d\u0438\u0446\u0430 \u0441\u0442\u043e\u043b\u043a\u043d\u043e\u0432\u0435\u043d\u0438\u044f \u0434\u0432\u0443\u0445 \u043a\u043e\u043b\u043e\u043d\u0438\u0439 \u0432\u043e\u043a\u0440\u0443\u0433 \u00ab+\u00bb */\n    float front=u.x+.22*sin(u.y*5.5-QT*1.8)+.11*cos(u.y*11.+QT*2.6);\n    vec2 w=u*3.2+vec2(sin(u.y*4.5+QT*.6),cos(u.x*4.2-QT*.5))*.55;\n    float net=pow(clamp(1.-abs(sin(w.x*2.4)*cos(w.y*2.4))*1.9,0.,1.),2.3);\n    /* \u0412\u0435\u043a\u0442\u043e\u0440\u043d\u044b\u0435 \u0430\u0433\u0435\u043d\u0442\u044b \u043d\u0430 \u0433\u0440\u0430\u043d\u0438\u0446\u0435 \u0438 \u0432 \u043f\u0440\u0430\u0432\u043e\u0439 \u043f\u043e\u043b\u0443\u043f\u043b\u043e\u0441\u043a\u043e\u0441\u0442\u0438 */\n    float cS=13.;vec2 cI=floor(P/cS),cL=P-(cI+.5)*cS;\n    vec2 fDir=normalize(vec2(-sin(w.y*2.4),cos(w.x*2.4)));\n    float boid=max(clamp(1.4-u5sg(cL,-fDir*cS*.36,fDir*cS*.36),0.,1.),step(length(cL-fDir*cS*.36),2.1))*step(.3,pk(cI*1.9));\n    vec3 colDom=front<0.?CG:CR;\n    if(abs(front)<.11&&net>.32){\n      /* \u0424\u0440\u043e\u043d\u0442 \u0433\u0438\u0431\u0440\u0438\u0434\u0438\u0437\u0430\u0446\u0438\u0438 \u0434\u0432\u0443\u0445 \u043a\u043e\u043b\u043e\u043d\u0438\u0439 \u2014 \u043f\u043b\u043e\u0442\u043d\u044b\u0439 \u0447\u0451\u0440\u043d\u044b\u0439 \u0443\u0437\u0435\u043b \u0441 \u0438\u0441\u043a\u0440\u0430\u043c\u0438 \u043e\u0431\u043e\u0438\u0445 \u0446\u0432\u0435\u0442\u043e\u0432 */\n      o=INK;\n      if(boid>.5)o=mod(cI.x+cI.y,2.)<.5?CG:CR;\n    }else if(net>.58){\n      o=net>.8?INK:colDom;\n      o=mix(o,PAP,boid*.75);\n    }else if(net>.22){\n      float prob=(net-.22)/.36;\n      o=dth<prob?(dth<prob*.45?INK:colDom):PAP;\n      o=mix(o,INK,boid);\n    }else{\n      o=mix(PAP,colDom,boid*.85);\n    }\n\n    #else\n    /* GLSL \u00b7 GPU Compute Boids & Spatial-Hash Quadtree (\u0432\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u0440\u043e\u0439 + \u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435 \u0445\u0435\u0448\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435):\n       \u043a\u043e\u043d\u0442\u0440\u0430\u0441\u0442\u043d\u044b\u0435 \u0441\u0433\u0443\u0441\u0442\u043a\u0438 \u0447\u0430\u0441\u0442\u0438\u0446, \u0432\u0435\u043a\u0442\u043e\u0440\u043d\u044b\u0435 \u0438\u0433\u043b\u044b \u0441\u043a\u043e\u0440\u043e\u0441\u0442\u0435\u0439 \u0438 \u0434\u0438\u043d\u0430\u043c\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0440\u0430\u043c\u043a\u0438 spatial-hash \u043a\u043b\u0435\u0442\u043e\u043a (48 / 24 / 12 px) */\n    vec3 CV=QS1;\n    vec2 q=p*2.6+vec2(sin(p.y*3.8+QT*.5),cos(p.x*3.4-QT*.4))*.45;\n    float flock=pow(clamp(1.-abs(sin(q.x*2.2+cos(q.y*2.5))-cos(q.y*2.1-sin(q.x*2.4)))*.85,0.,1.),2.5);\n    /* \u041f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439 \u0445\u0435\u0448 (Quadtree Spatial Grid): \u0433\u0434\u0435 \u043f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c flock \u0432\u044b\u0448\u0435, \u043a\u043b\u0435\u0442\u043a\u0430 \u0434\u0435\u043b\u0438\u0442\u0441\u044f 48 \u2192 24 \u2192 12 px */\n    float g48=48.,g24=24.,g12=12.;\n    vec2 c24=floor(P/g24),p24=(c24+.5)*g24;\n    vec2 q24=(p24-vec2(R.x*.52,top+hb*.48))/hb*2.6;\n    float fl24=pow(clamp(1.-abs(sin(q24.x*2.2+cos(q24.y*2.5))-cos(q24.y*2.1-sin(q24.x*2.4)))*.85,0.,1.),2.5);\n    float activeG=fl24>.52?g12:fl24>.25?g24:g48;\n    vec2 cF=fract(P/activeG),cI=floor(P/activeG),cLoc=P-(cI+.5)*activeG;\n    float boxLine=max(step(cF.x,1.25/activeG),step(cF.y,1.25/activeG));\n    /* \u0412 \u043a\u0430\u0436\u0434\u043e\u0439 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0439 \u043a\u043b\u0435\u0442\u043a\u0435 \u2014 \u043a\u0430\u043b\u0438\u0431\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0430\u0433\u0435\u043d\u0442 \u0440\u043e\u044f (\u0432\u0435\u043a\u0442\u043e\u0440 + \u044f\u0434\u0440\u043e) */\n    float vAng=sin(q24.x*2.5)*cos(q24.y*2.5)*3.14159+QT*.8;\n    vec2 vDir=vec2(cos(vAng),sin(vAng));\n    float needle=max(clamp(1.4-u5sg(cLoc,-vDir*activeG*.32,vDir*activeG*.32),0.,1.),step(length(cLoc-vDir*activeG*.32),2.2));\n    if(flock>.64){\n      o=flock>.82?INK:CV;\n      o=mix(o,PAP,max(needle*.85,boxLine*.45));\n    }else if(flock>.28){\n      float prob=(flock-.28)/.36;\n      o=dth<prob?(dth<prob*.48?INK:CV):PAP;\n      o=mix(o,INK,max(needle,boxLine*.65));\n    }else{\n      o=mix(PAP,fl24>.25?CV:INK,max(needle*.75,boxLine*.38));\n    }\n    #endif\n    float bdr=max(clamp(1.5-abs(yt-top),0.,1.),clamp(1.5-abs(yt-bot),0.,1.));o=mix(o,INK,bdr*.75);\n    return o*(1.-.035*(pk(floor(fc*.5)+19.)-.5));\n  }\n  #endif\n  #ifdef UP8\n  /* \u0412\u0410\u0420\u0418\u0410\u041d\u0422 A (?x=up8) \u2014 \u00ab\u0424\u0418\u0417\u0418\u041a\u0410 \u041f\u041e\u041b\u042f \u0418 \u0410\u0422\u0422\u0420\u0410\u041a\u0422\u041e\u0420\u042b\u00bb (Alva Noto / Carsten Nicolai, Robert Henke, \u0441\u0442\u043e\u044f\u0447\u0438\u0435 \u0432\u043e\u043b\u043d\u044b, \u043a\u0430\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0438\u0435, Reaction-Diffusion):\n     U5M=0 (Extreme I): 36 \u0441\u0442\u0440\u0443\u043d \u043e\u0441\u0446\u0438\u043b\u043b\u043e\u0433\u0440\u0430\u0444\u0430 \u0441\u043e \u0441\u0442\u043e\u044f\u0447\u0435\u0439 \u0430\u043a\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0432\u043e\u043b\u043d\u043e\u0439 + \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0435 \u043f\u0438\u043d\u044b \u0432\u044b\u0431\u043e\u0440\u043e\u043a (sample & hold pins) \u0438 \u043a\u0432\u0430\u043d\u0442\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u0443\u0437\u043b\u044b \u0444\u0430\u0437\u044b.\n     U5M=1 (Extreme II): \u041b\u0430\u0437\u0435\u0440\u043d\u0430\u044f \u043a\u0430\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f (Caustic String Envelope / \u0430\u0442\u0442\u0440\u0430\u043a\u0442\u043e\u0440 \u041a\u043b\u0438\u0444\u0444\u043e\u0440\u0434\u0430) \u2014 \u043f\u0443\u0447\u043a\u0438 \u0442\u043e\u043d\u043a\u0438\u0445 \u0433\u0435\u043e\u0434\u0435\u0437\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u0445\u043e\u0440\u0434, \u0441\u0445\u043e\u0434\u044f\u0449\u0438\u0445\u0441\u044f \u0432 \u043a\u0430\u0443\u0441\u0442\u0438\u043a\u0443.\n     U5M=2 (\u041f\u0430\u043a\u0435\u0442 I+II): \u041d\u0435\u043b\u0438\u043d\u0435\u0439\u043d\u0430\u044f \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0440\u0435\u043d\u0446\u0438\u044f \u0434\u0432\u0443\u0445 \u0432\u043e\u043b\u043d\u043e\u0432\u044b\u0445 \u0438\u0437\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u0435\u0439 (\u0430\u043a\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0440\u0435\u0448\u0451\u0442\u043a\u0430 I \u00d7 \u0432\u044b\u0441\u043e\u043a\u043e\u0447\u0430\u0441\u0442\u043e\u0442\u043d\u0430\u044f \u043b\u0430\u0437\u0435\u0440\u043d\u0430\u044f \u0440\u0435\u0448\u0451\u0442\u043a\u0430 II \u2014 \u0433\u0438\u043f\u0435\u0440\u0431\u043e\u043b\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0443\u0430\u0440).\n     U5M=3 (GLSL): \u041f\u043e\u043b\u0435 \u0420\u0435\u0430\u043a\u0446\u0438\u0438-\u0414\u0438\u0444\u0444\u0443\u0437\u0438\u0438 (Turing / Gray-Scott morphogenesis) + \u0432\u043b\u043e\u0436\u0435\u043d\u043d\u044b\u0435 SDF-\u0438\u0437\u043e\u043b\u0438\u043d\u0438\u0438 \u0438 \u043c\u0430\u0442\u0440\u0438\u0446\u0430 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u043d\u044b\u0445. */\n  { vec2 P=vec2(x,yt);float st=QU.z,xc=QZ.x;vec3 o=PAP;\n    vec2 uv=(P-vec2(R.x*.5,top+hb*.5))/hb;\n    #if U5M==0\n    vec3 C_GRN=QS1;\n    /* 36 \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0445 \u043a\u0430\u043d\u0430\u043b\u043e\u0432 \u043e\u0441\u0446\u0438\u043b\u043b\u043e\u0433\u0440\u0430\u0444\u0430 (Alva Noto \u00abwellenwanne\u00bb): \u0441\u0442\u043e\u044f\u0447\u0430\u044f \u0432\u043e\u043b\u043d\u0430 4 \u0447\u0430\u0441\u0442\u043e\u0442 + \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0435 \u043f\u0438\u043d\u044b \u043e\u0442\u0441\u0447\u0451\u0442\u043e\u0432 */\n    float N_ch=st>.5?24.:34.,chH=hb/N_ch,ci=floor((yt-top)/chH),yc=top+(ci+.5)*chH;\n    float u=x/hb,yn=(ci/N_ch)-.5;\n    /* \u0421\u0443\u0
