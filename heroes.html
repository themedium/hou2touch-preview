0430\u044f \u043e\u0441\u044c \u043a\u0430\u0436\u0434\u043e\u0433\u043e 4-\u0433\u043e \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430 */\n    if(mod(ci,4.)<.5)o=mix(o,INK,clamp(1.-abs(yt-yc),0.,1.)*.28);\n\n    #elif U5M==1\n    vec3 C_RED=QS1;\n    /* \u041b\u0430\u0437\u0435\u0440\u043d\u0430\u044f \u043a\u0430\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f (Robert Henke \u00abLumi\u00e8re\u00bb / \u0444\u0430\u0437\u043e\u0432\u044b\u0439 \u043f\u043e\u0440\u0442\u0440\u0435\u0442 \u0433\u0430\u0440\u043c\u043e\u043d\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u043e\u0441\u0446\u0438\u043b\u043b\u044f\u0442\u043e\u0440\u0430):\n       \u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432\u043e \u0438\u0437 40 \u0444\u0430\u0437\u043e\u0432\u043e-\u0441\u0434\u0432\u0438\u043d\u0443\u0442\u044b\u0445 \u043f\u0430\u0440\u0430\u043c\u0435\u0442\u0440\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u0432\u043e\u043b\u043d, \u0441\u0445\u043e\u0434\u044f\u0449\u0438\u0445\u0441\u044f \u0432 \u043e\u0441\u0442\u0440\u044b\u0435 \u043a\u0430\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0433\u0440\u0435\u0431\u043d\u0438 */\n    vec2 p=vec2((x-R.x*.52)/hb,(yt-(top+hb*.50))/hb);\n    float accInk=0.,accRed=0.;\n    for(int i=0;i<36;i++){\n      float fi=float(i)/36.,ph=fi*3.14159265+QT*.35;\n      /* \u041d\u0435\u043b\u0438\u043d\u0435\u0439\u043d\u0430\u044f \u043b\u0430\u0437\u0435\u0440\u043d\u0430\u044f \u0440\u0430\u0437\u0432\u0451\u0440\u0442\u043a\u0430: \u043e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f \u0441\u043a\u043b\u0430\u0434\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043d\u0430 \u043a\u0440\u0430\u044f\u0445 \u0438 \u0432 \u0444\u043e\u043a\u0443\u0441\u0430\u0445 */\n      float yCurve=.42*sin(p.x*2.6+ph+.55*sin(p.x*1.8-ph*1.5))+.16*cos(p.x*5.2-ph*2.+QT*.5);\n      float d=abs(p.y-yCurve)*hb/sqrt(1.+pow(cos(p.x*2.6+ph)*1.1,2.));\n      float w=clamp(1.45-d,0.,1.);\n      if(mod(float(i),4.)<.5)accRed=max(accRed,clamp(1.85-d,0.,1.));\n      else accInk+=w;\n    }\n    /* \u0412\u0442\u043e\u0440\u0430\u044f \u043e\u0440\u0442\u043e\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u0430\u044f \u043a\u0430\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0433\u0430\u0440\u043c\u043e\u043d\u0438\u043a\u0430 */\n    for(int j=0;j<18;j++){\n      float fj=float(j)/18.,ph2=fj*3.14159265-QT*.28;\n      float xCurve=.65*sin(p.y*3.2+ph2)+.25*cos(p.y*6.4-ph2*2.);\n      float d2=abs(p.x-.18-xCurve)*hb*.75;\n      if(mod(float(j),3.)<.5)accRed=max(accRed,clamp(1.6-d2,0.,1.));\n      else accInk+=clamp(1.3-d2,0.,1.)*.7;\n    }\n    o=mix(PAP,INK,clamp(accInk*.85,0.,1.));\n    o=mix(o,C_RED,clamp(accRed,0.,1.));\n    /* \u041d\u0430 \u043f\u0438\u043a\u0430\u0445 \u043f\u0435\u0440\u0435\u0441\u0435\u0447\u0435\u043d\u0438\u0439 \u043a\u0430\u0443\u0441\u0442\u0438\u043a\u0438 (\u0432\u044b\u0441\u043e\u043a\u0430\u044f \u043f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c \u043d\u0438\u0442\u0435\u0439) \u2014 \u0432\u0441\u043f\u044b\u0448\u043a\u0438 \u043a\u0430\u0440\u043c\u0438\u043d\u0430 */\n    if(accInk>2.1)o=C_RED;\n\n    #elif U5M==2\n    vec3 C_GRN=QS1,C_RED=QS2;\n    /* \u0418\u043d\u0442\u0435\u0440\u0444\u0435\u0440\u0435\u043d\u0446\u0438\u044f \u0434\u0432\u0443\u0445 \u0432\u043e\u043b\u043d\u043e\u0432\u044b\u0445 \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440\u043e\u0432 (Carsten Nicolai \u00abunidisplay\u00bb): S1 (\u0430\u043a\u0443\u0441\u0442\u0438\u043a\u0430 I, \u0437\u0435\u043b\u0451\u043d\u044b\u0439) \u00d7 S2 (\u043e\u043f\u0442\u0438\u043a\u0430 II, \u043a\u0430\u0440\u043c\u0438\u043d) */\n    vec2 S1p=vec2(R.x*(st>.5?.26:.32),top+hb*.48),S2p=vec2(R.x*(st>.5?.74:.72),top+hb*.50);\n    float d1=length(P-S1p),d2=length(P-S2p);\n    float k1=st>.5?.32:.26,k2=st>.5?.38:.31;\n    float ph1=sin(d1*k1-QT*3.14159),ph2=sin(d2*k2+ atan(P.y-S2p.y,P.x-S2p.x)*6. -QT*4.71238);\n    /* \u041f\u043e\u043b\u0435 \u0441\u0443\u043f\u0435\u0440\u043f\u043e\u0437\u0438\u0446\u0438\u0438 \u0438 \u0433\u0438\u043f\u0435\u0440\u0431\u043e\u043b\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0443\u0437\u043b\u044b \u0441\u0442\u043e\u044f\u0447\u0435\u0439 \u0432\u043e\u043b\u043d\u044b */\n    float superP=ph1+ph2,diffP=ph1*ph2;\n    /* \u0414\u0438\u0441\u043a\u0440\u0435\u0442\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 \u0437\u0430\u043c\u0435\u0440\u0430 \u0444\u0430\u0437\u044b 10 px */\n    vec2 gQ=floor(P/10.)*10.+5.;\n    float gd1=length(gQ-S1p),gd2=length(gQ-S2p);\n    float gSuper=sin(gd1*k1-QT*3.14159)+sin(gd2*k2+atan(gQ.y-S2p.y,gQ.x-S2p.x)*6.-QT*4.71238);\n    if(abs(superP)<.28){\n      /* \u0423\u0437\u043b\u043e\u0432\u0430\u044f \u043b\u0438\u043d\u0438\u044f \u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0442\u0438\u0432\u043d\u043e\u0439 \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0440\u0435\u043d\u0446\u0438\u0438 \u2014 \u0433\u043b\u0443\u0431\u043e\u043a\u0438\u0439 INK \u0441 \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u043c\u0438 \u043a\u0432\u0430\u043d\u0442\u043e\u0432\u044b\u043c\u0438 \u0442\u043e\u0447\u043a\u0430\u043c\u0438 */\n      float qDot=step(length(P-gQ),3.2);\n      o=mix(INK,d1<d2*1.08?C_GRN:C_RED,qDot);\n    }else if(superP>.85){\n      /* \u0413\u0440\u0435\u0431\u0435\u043d\u044c \u0430\u043a\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0444\u0430\u0437\u044b I (\u0437\u0435\u043b\u0451\u043d\u044b\u0439) */\n      float ring1=clamp(1.6-abs(fract(d1/14.-QT*.5)-.5)*14.,0.,1.);\n      o=mix(C_GRN,INK,ring1*.75);\n    }else if(superP<-.85){\n      /* \u0413\u0440\u0435\u0431\u0435\u043d\u044c \u043e\u043f\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0444\u0430\u0437\u044b II (\u043a\u0430\u0440\u043c\u0438\u043d) */\n      float ring2=clamp(1.6-abs(fract(d2/12.-QT*.75)-.5)*12.,0.,1.);\n      o=mix(C_RED,INK,ring2*.75);\n    }else{\n      /* \u041c\u0435\u0436\u0434\u0443 \u0433\u0440\u0435\u0431\u043d\u044f\u043c\u0438 \u2014 \u0432\u0435\u043a\u0442\u043e\u0440\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 \u043e\u0442\u0441\u0447\u0451\u0442\u043e\u0432 \u0438 \u0442\u043e\u043d\u043a\u0438\u0435 \u0444\u0440\u043e\u043d\u0442\u044b \u043e\u0431\u043e\u0438\u0445 \u0438\u0437\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u0435\u0439 */\n      float f1=clamp(1.3-abs(ph1)*4.5,0.,1.),f2=clamp(1.3-abs(ph2)*4.5,0.,1.);\n      o=mix(PAP,C_GRN,f1*.75);\n      o=mix(o,C_RED,f2*.75);\n      if(abs(gSuper)>1.1)o=mix(o,INK,step(length(P-gQ),2.2));\n    }\n\n    #else\n    vec3 C_PUR=QS1;\n    /* GLSL (U5M=3) \u00b7 \u0420\u0435\u0430\u043a\u0446\u0438\u044f-\u0414\u0438\u0444\u0444\u0443\u0437\u0438\u044f (Turing / Gray-Scott) + SDF-\u0438\u0437\u043e\u043b\u0438\u043d\u0438\u0438 \u0438 \u043c\u0430\u0442\u0440\u0438\u0446\u0430 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u043d\u044b\u0445 */\n    vec2 p=(P-vec2(R.x*.58,top+hb*.50))/hb;\n    /* \u041c\u043d\u043e\u0433\u043e\u043c\u0430\u0441\u0448\u0442\u0430\u0431\u043d\u044b\u0439 \u043e\u043f\u0435\u0440\u0430\u0442\u043e\u0440 \u041b\u0430\u043f\u043b\u0430\u0441\u0430 (\u0440\u0430\u0437\u043d\u043e\u0441\u0442\u044c \u0433\u0430\u0443\u0441\u0441\u0438\u0430\u043d / \u0430\u043d\u0438\u0437\u043e\u0442\u0440\u043e\u043f\u043d\u044b\u0439 \u043f\u0430\u0442\u0442\u0435\u0440\u043d \u0422\u044c\u044e\u0440\u0438\u043d\u0433\u0430) */\n    vec2 q=p*4.2+vec2(sin(p.y*6.+QT*.6),cos(p.x*6.-QT*.5))*.35;\n    float u1=sin(q.x*3.1+cos(q.y*2.7+QT*.4)*1.8)+cos(q.y*3.3-sin(q.x*2.9-QT*.3)*1.8);\n    vec2 q2=mat2(.8,-.6,.6,.8)*q*2.15+vec2(u1*.45);\n    float u2=sin(q2.x*2.8+cos(q2.y*3.1)*1.5)-cos(q2.y*2.6+sin(q2.x*2.4)*1.5);\n    float rd=u1*.58+u2*.42; /* \u043f\u043e\u043b\u0435 \u043a\u043e\u043d\u0446\u0435\u043d\u0442\u0440\u0430\u0446\u0438\u0438 \u0422\u044c\u044e\u0440\u0438\u043d\u0433\u0430 */\n    /* \u041e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f \u043f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u0438: \u0441\u043f\u0440\u0430\u0432\u0430 \u0438 \u0432 \u0446\u0435\u043d\u0442\u0440\u0435 \u2014 \u0444\u0430\u0437\u0430 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u043c\u043e\u0440\u0444\u043e\u0433\u0435\u043d\u0435\u0437\u0430, \u0441\u043b\u0435\u0432\u0430 \u2014 \u0447\u0438\u0441\u0442\u044b\u0435 \u043c\u0430\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435 SDF-\u0438\u0437\u043e\u043b\u0438\u043d\u0438\u0438 */\n    float morph=smoothstep(-.65,.25,p.x+sin(p.y*3.)*.15);\n    /* \u0414\u0438\u0441\u043a\u0440\u0435\u0442\u043d\u0430\u044f \u0432\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 \u0448\u0435\u0439\u0434\u0435\u0440\u0430 16 px */\n    float gS=16.;vec2 cI=floor(P/gS),cF=fract(P/gS);\n    float gLine=max(step(cF.x,1./gS),step(cF.y,1./gS));\n    if(morph>.45&&abs(rd)<.42){\n      /* \u041a\u043e\u0440\u0430\u043b\u043b\u043e\u0432\u044b\u0435 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u044b \u0420\u0435\u0430\u043a\u0446\u0438\u0438-\u0414\u0438\u0444\u0444\u0443\u0437\u0438\u0438: \u0447\u0451\u0440\u043d\u043e\u0435 \u044f\u0434\u0440\u043e + \u0444\u0438\u043e\u043b\u0435\u0442\u043e\u0432\u0430\u044f \u043c\u0435\u043c\u0431\u0440\u0430\u043d\u0430 \u0444\u0440\u043e\u043d\u0442\u0430 \u0440\u0435\u0430\u043a\u0446\u0438\u0438 */\n      float core=step(abs(rd),.22);\n      o=core>.5?INK:C_PUR;\n      /* \u0412\u043d\u0443\u0442\u0440\u0438 \u043c\u0435\u043c\u0431\u0440\u0430\u043d\u044b \u2014 \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u0435 \u0442\u043e\u0447\u043a\u0438 \u043a\u043b\u0435\u0442\u043e\u0447\u043d\u043e\u0433\u043e \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0430 */\n      if(core>.5&&step(length(cF-.5),.24)>.5&&pk(cI)>.45)o=C_PUR;\n    }else{\n      /* \u0412\u043e\u043a\u0440\u0443\u0433 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440 \u2014 \u0447\u0430\u0441\u0442\u044b\u0435 \u0442\u043e\u043f\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0435 SDF-\u0438\u0437\u043e\u043b\u0438\u043d\u0438\u0438 \u0440\u0430\u0441\u0441\u0442\u043e\u044f\u043d\u0438\u044f \u0434\u043e \u0444\u0440\u043e\u043d\u0442\u0430 \u0440\u0435\u0430\u043a\u0446\u0438\u0438 */\n      float iso=abs(fract(rd*3.5-QT*.25)-.5)*2.;\n      float ln=clamp(1.4-iso*7.,0.,1.);\n      float isPur=step(.5,mod(floor(rd*3.5),2.));\n      o=mix(PAP,isPur>.5?C_PUR:INK,ln*(.55+.45*morph));\n      o=mix(o,INK,gLine*.22);\n    }\n    #endif\n    float bdr=max(clamp(1.5-abs(yt-top),0.,1.),clamp(1.5-abs(yt-bot),0.,1.));\n    o=mix(o,INK,bdr*.75);\n    return o*(1.-.035*(pk(floor(fc*.5)+3.)-.5));\n  }\n  #endif\n  #ifdef UP9\n  /* \u0412\u0410\u0420\u0418\u0410\u041d\u0422 B (?x=up9) \u2014 \u00ab\u0418\u041a\u042d\u0414\u0410 / \u0426\u0418\u0424\u0420\u041e\u0412\u041e\u0419 \u0411\u0420\u0423\u0422\u0410\u041b\u0418\u0417\u041c\u00bb (Ryoji Ikeda \u00abtest pattern\u00bb / \u00abdatamatics\u00bb, Nonotak, PWM-\u0448\u0442\u0440\u0438\u0445\u043a\u043e\u0434\u044b, Lidar Point-Cloud):\n     U5M=0 (Extreme I): 4-\u0434\u043e\u0440\u043e\u0436\u0435\u0447\u043d\u044b\u0439 \u0432\u044b\u0441\u043e\u043a\u043e\u0447\u0430\u0441\u0442\u043e\u0442\u043d\u044b\u0439 PWM-\u0441\u0435\u043a\u0432\u0435\u043d\u0441\u043e\u0440 \u0432 \u0441\u0442\u0438\u043b\u0435 Ryoji Ikeda \u00abtest pattern\u00bb + \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u0435 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u044b \u0438 \u0437\u0435\u043b\u0451\u043d\u044b\u0435 \u0441\u0442\u0440\u043e\u0431\u044b.\n     U5M=1 (Extreme II): \u041f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u0430\u044f \u043b\u0430\u0437\u0435\u0440\u043d\u0430\u044f \u0440\u0435\u0448\u0451\u0442\u043a\u0430 Nonotak (\u00abDaydream\u00bb) \u2014 \u043f\u0435\u0440\u0435\u0441\u0435\u043a\u0430\u044e\u0449\u0438\u0435\u0441\u044f \u0441\u0432\u0435\u0442\u043e\u0432\u044b\u0435 \u043f\u043b\u043e\u0441\u043a\u043e\u0441\u0442\u0438 \u0438 \u0441\u0442\u0440\u043e\u0431\u043e\u0441\u043a\u043e\u043f\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0449\u0435\u043b\u0438.\n     U5M=2 (\u041f\u0430\u043a\u0435\u0442 I+II): \u041c\u0430\u0442\u0440\u0438\u0446\u0430 \u00abdatamatics\u00bb \u2014 XOR-\u0441\u0443\u043f\u0435\u0440\u043f\u043e\u0437\u0438\u0446\u0438\u044f \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0445 \u0437\u0432\u0443\u043a\u043e\u0432\u044b\u0445 \u0448\u0442\u0440\u0438\u0445\u043a\u043e\u0434\u043e\u0432 I (\u0437\u0435\u043b\u0451\u043d\u044b\u0439) \u0438 \u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0445 \u043b\u0430\u0437\u0435\u0440\u043d\u044b\u0445 \u0441\u043a\u0430\u043d\u043e\u0432 II (\u043a\u0430\u0440\u043c\u0438\u043d).\n     U5M=3 (GLSL): \u041b\u0438\u0434\u0430\u0440\u043d\u043e\u0435 3D-\u043e\u0431\u043b\u0430\u043a\u043e \u0442\u043e\u0447\u0435\u043a \u0433\u043b\u0443\u0431\u0438\u043d\u044b (Lidar Depth Point-Cloud) + \u0432\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0431\u043e\u043a\u0441\u044b \u043a\u043b\u0430\u0441\u0442\u0435\u0440\u043e\u0432 (Compute Shader BBoxes). */\n  { vec2 P=vec2(x,yt);float st=QU.z,xc=QZ.x;vec3 o=PAP;\n    #if U5M==0\n    vec3 C_GRN=QS1;\n    /* 4 \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0445 \u0434\u0430\u0442\u0430-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430 (Ryoji Ikeda \u00abtest pattern\u00bb): 4 \u0447\u0430\u0441\u0442\u0438 \u043a\u0443\u0440\u0441\u0430 */\n    float trIdx=floor((yt-top)/(hb*.25)),trY=fract((yt-top)/(hb*.25));\n    float speed=(mod(trIdx,2.)<.5?1.:-1.)*(60.+trIdx*35.);\n    float xSc=x+QT*speed;\n    /* \u0412 \u043a\u0430\u0436\u0434\u043e\u043c \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0435: \u0432\u0435\u0440\u0445\u043d\u0438\u0435 68% \u2014 PWM-\u0448\u0442\u0440\u0438\u0445\u043a\u043e\u0434 \u043f\u0435\u0440\u0435\u043c\u0435\u043d\u043d\u043e\u0439 \u0441\u043a\u0432\u0430\u0436\u043d\u043e\u0441\u0442\u0438, \u043d\u0438\u0436\u043d\u0438\u0435 26% \u2014 1-\u0431\u0438\u0442\u043d\u0430\u044f \u043c\u0430\u0442\u0440\u0438\u0446\u0430 \u0434\u0430\u043d\u043d\u044b\u0445, 6% \u2014 \u0440\u0430\u0437\u0434\u0435\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0448\u0438\u043d\u0430 */\n    float colW=mix(6.,24.,pk(vec2(floor(xSc/48.),trIdx*7.1+floor(QT*2.))));\n    float cellId=floor(xSc/colW),cellF=fract(xSc/colW);\n    float hB=pk(vec2(cellId,trIdx*13.7+floor(QT*1.5)));\n    /* \u041e\u0433\u0438\u0431\u0430\u044e\u0449\u0430\u044f \u043f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u0438 \u0437\u0432\u0443\u043a\u0430 \u043f\u043e \u0448\u0438\u0440\u0438\u043d\u0435 */\n    float waveEnv=.5+.5*sin(x/(hb*.55)-QT*2.+trIdx*1.4)*cos(x/(hb*.23)+QT*1.2);\n    if(trY<.68){\n      /* \u0417\u043e\u043d\u0430 PWM-\u0448\u0442\u0440\u0438\u0445\u043a\u043e\u0434\u0430 \u0418\u043a\u044d\u0434\u044b */\n      float duty=clamp(hB*waveEnv*1.35,0.,.92);\n      bool barOn=cellF<duty&&hB>.22;\n      bool isGrn=barOn&&(hB>.74||(abs(x-xc)<hb*.35&&mod(cellId,3.)<.5));\n      o=isGrn?C_GRN:barOn?INK:PAP;\n    }else if(trY<.94){\n      /* \u0417\u043e\u043d\u0430 1-\u0431\u0438\u0442\u043d\u043e\u0439 \u043c\u0438\u043a\u0440\u043e-\u043c\u0430\u0442\u0440\u0438\u0446\u044b \u043e\u0442\u0441\u0447\u0451\u0442\u043e\u0432 (bitstream) */\n      vec2 bm=floor(vec2(xSc,yt)/4.);\n      float bit=step(.48,pk(bm*.71+trIdx*3.3));\n      o=bit>.5?(pk(bm*1.3)>.78?C_GRN:INK):PAP;\n    }else{\n      /* \u0413\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u0430\u044f \u0448\u0438\u043d\u0430 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430 \u0441 \u0442\u0430\u043a\u0442\u043e\u0432\u044b\u043c\u0438 \u0437\u0430\u0441\u0435\u0447\u043a\u0430\u043c\u0438 */\n      o=step(mod(x,16.),2.)>.5?INK:PAP;\n    }\n\n    #elif U5M==1\n    vec3 C_RED=QS1;\n    /* \u041b\u0430\u0437\u0435\u0440\u043d\u0430\u044f \u0430\u0440\u0445\u0438\u0442\u0435\u043a\u0442\u0443\u0440\u0430 Nonotak (\u00abDaydream\u00bb): \u043f\u0435\u0440\u0441\u043f\u0435\u043a\u0442\u0438\u0432\u043d\u044b\u0439 \u043a\u043e\u0440\u0438\u0434\u043e\u0440 \u0438\u0437 \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0445 \u0449\u0435\u043b\u0435\u0439 \u0438 \u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0445 \u043f\u043b\u043e\u0441\u043a\u043e\u0441\u0442\u0435\u0439 \u0441\u0432\u0435\u0442\u0430 */\n    vec2 C0=vec2(R.x*(st>.5?.54:.60),top+hb*.50);\n    vec2 p=(P-C0)/hb;\n    /* \u041f\u0435\u0440\u0441\u043f\u0435\u043a\u0442\u0438\u0432\u043d\u0430\u044f \u0434\u0435\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044f \u043f\u043b\u043e\u0441\u043a\u043e\u0441\u0442\u0435\u0439 (\u0433\u043b\u0443\u0431\u0438\u043d\u0430 Z \u043a \u043e\u043f\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043e\u0441\u0438 C0) */\n    float zDepth=1./(abs(p.x)*.85+.18);\n    float vGrid=fract(zDepth*1.8-QT*.5),hGrid=fract(p.y*zDepth*1.6);\n    /* \u041e\u0441\u0442\u0440\u044b\u0435 \u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0435 \u043b\u0430\u0437\u0435\u0440\u043d\u044b\u0435 \u043f\u043b\u043e\u0441\u043a\u043e\u0441\u0442\u0438 (\u0432\u0435\u0435\u0440 \u0438\u0437 12 \u043b\u0443\u0447\u0435\u0439 \u0438\u0437 \u0432\u0435\u0440\u0445\u043d\u0435\u0439 \u0438 \u043d\u0438\u0436\u043d\u0435\u0439 \u0440\u0430\u043c\u043f\u044b) */\n    float fan1=abs(fract((p.x/(abs(p.y)+.12))*1.6-QT*.25)-.5)*2.;\n    float fan2=abs(fract(((p.x-.25)/(abs(p.y-.48)+.14))*1.8+QT*.2)-.5)*2.;\n    float beam1=clamp(1.5-fan1*hb*.035/(abs(p.y)+.15),0.,1.);\n    float beam2=clamp(1.5-fan2*hb*.035/(abs(p.y-.48)+.15),0.,1.);\n    /* \u0412\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0435 \u0441\u0442\u0440\u043e\u0431\u043e\u0441\u043a\u043e\u043f\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u043a\u043e\u043b\u043e\u043d\u043d\u044b Nonotak */\n    float slitW=clamp(1.6-abs(vGrid-.5)*22./zDepth,0.,1.);\n    float hBar=clamp(1.4-abs(hGrid-.5)*18.,0.,1.);\n    /* \u0427\u0451\u0440\u043d\u044b\u0435 \u0430\u0440\u0445\u0438\u0442\u0435\u043a\u0442\u0443\u0440\u043d\u044b\u0435 \u043f\u043e\u0440\u0442\u0430\u043b\u044b \u0432 \u0433\u043b\u0443\u0431\u0438\u043d\u0435 \u043a\u043e\u0440\u0438\u0434\u043e\u0440\u0430 */\n    bool inPortal=abs(p.x)<.42&&step(.38,fract(zDepth*.9-QT*.25))>.5;\n    if(inPortal){\n      o=mix(INK,C_RED,max(beam1,slitW*.85));\n      o=mix(o,PAP,beam2*hBar);\n    }else{\n      o=mix(PAP,INK,max(slitW*.85,hBar*.45));\n      o=mix(o,C_RED,max(beam1,beam2*.85));\n      /* \u041d\u0430 \u043f\u0435\u0440\u0435\u0441\u0435\u0447\u0435\u043d\u0438\u044f\u0445 \u043b\u0443\u0447\u0435\u0439 \u2014 \u0436\u0451\u0441\u0442\u043a\u0438\u0435 \u0447\u0451\u0440\u043d\u043e-\u043a\u0430\u0440\u043c\u0438\u043d\u043d\u044b\u0435 \u0443\u0437\u043b\u044b */\n      if(beam1>.2&&beam2>.2)o=C_RED;\n    }\n\n    #elif U5M==2\n    vec3 C_GRN=QS1,C_RED=QS2;\n    /* Ikeda \u00abdatamatics\u00bb Dual-System: \u0441\u0442\u0440\u043e\u0433\u0430\u044f \u043c\u0430\u0442\u0440\u0438\u0447\u043d\u0430\u044f \u0441\u0443\u043f\u0435\u0440\u043f\u043e\u0437\u0438\u0446\u0438\u044f \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0445 \u0434\u0430\u0442\u0430-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u043e\u0432 I (\u0437\u0435\u043b\u0451\u043d\u044b\u0439) \u0438 \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u043e-\u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0445 \u0441\u043a\u0430\u043d\u043e\u0432 II (\u043a\u0430\u0440\u043c\u0438\u043d) */\n    float rowH=st>.5?16.:20.,rId=floor((yt-top)/rowH),rF=fract((yt-top)/rowH);\n    float xFlow=x-QT*(60.+mod(rId,4.)*30.);\n    float colW=mix(8.,36.,pk(vec2(floor(xFlow/64.),rId*5.3)));\n    float cId=floor(xFlow/colW),cF=fract(xFlow/colW);\n    /* \u041f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c \u0441\u0438\u0441\u0442\u0435\u043c\u044b I (\u0437\u0432\u0443\u043a) \u0432\u044b\u0448\u0435 \u0441\u043b\u0435\u0432\u0430 \u0438 \u0432 \u0432\u0435\u0440\u0445\u043d\u0438\u0445 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0445, \u0441\u0438\u0441\u0442\u0435\u043c\u044b II (\u0441\u0432\u0435\u0442) \u2014 \u0441\u043f\u0440\u0430\u0432\u0430 \u043e\u0442 \u00ab+\u00bb \u0438 \u0432 \u043d\u0438\u0436\u043d\u0438\u0445/\u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0445 \u0441\u0440\u0435\u0437\u0430\u0445 */\n    float wI=smoothstep(R.x*.85,R.x*.15,x+.25*(yt-top)),wII=smoothstep(R.x*.15,R.x*.85,x+.35*(yt-top));\n    float sigI=step(1.-wI*.78,pk(vec2(cId,rId*7.1+floor(QT*2.))))*step(rF,.76)*step(cF,.86);\n    /* \u0421\u0438\u0441\u0442\u0435\u043c\u0430 II: \u043a\u0432\u0430\u043d\u0442\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0435 \u043b\u0430\u0437\u0435\u0440\u043d\u044b\u0435 \u0448\u0438\u043d\u044b \u043f\u043e\u0434 45\u00b0 \u0438 \u0432\u044b\u0441\u043e\u043a\u043e\u0447\u0430\u0441\u0442\u043e\u0442\u043d\u044b\u0439 \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0439 \u0448\u0442\u0440\u0438\u0445\u043a\u043e\u0434 */\n    float dCoord=(x-xc)+(yt-(top+hb*.5))*((mod(rId,2.)<.5)?1.:-1.);\n    float bId=floor((dCoord+QT*80.)/14.),bF=fract((dCoord+QT*80.)/14.);\n    float sigII=step(1.-wII*.82,pk(vec2(bId,rId*3.9)))*step(bF,.65)*step(rF,.82);\n    if(sigI>.5&&sigII>.5){\n      /* \u041a\u043e\u043b\u043b\u0438\u0437\u0438\u044f I \u00d7 II: \u0447\u0451\u0440\u043d\u044b\u0439 \u0434\u0430\u0442\u0430-\u0431\u043b\u043e\u043a \u0441 \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u043c \u0440\u0430\u0441\u0442\u0440\u043e\u043c 4 px */\n      vec2 bm=fract(P/5.);\n      o=step(length(bm-.5),.3)>.5?(mod(rId,2.)<.5?C_GRN:C_RED):INK;\n    }else if(sigI>.5){\n      o=pk(vec2(cId,rId))>.62?INK:C_GRN;\n    }else if(sigII>.5){\n      o=pk(vec2(bId,rId+9.))>.62?INK:C_RED;\n    }else{\n      /* \u0422\u043e\u0447\u043d\u0430\u044f \u043a\u043e\u043e\u0440\u0434\u0438\u043d\u0430\u0442\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 datamatics (32 px) \u0441 \u043c\u0438\u043a\u0440\u043e-\u043c\u0430\u0440\u043a\u0435\u0440\u0430\u043c\u0438 \u0443\u0437\u043b\u043e\u0432 */\n      vec2 g32=fract(P/32.);\n      float grid=max(step(g32.x,1./32.),step(g32.y,1./32.));\n      o=mix(PAP,INK,grid*.25);\n    }\n\n    #else\n    vec3 C_PUR=QS1;\n    /* GLSL (U5M=3) \u00b7 \u041b\u0438\u0434\u0430\u0440\u043d\u043e\u0435 3D-\u043e\u0431\u043b\u0430\u043a\u043e \u0442\u043e\u0447\u0435\u043a \u0433\u043b\u0443\u0431\u0438\u043d\u044b (Lidar Point-Cloud) + \u0440\u0430\u043c\u043a\u0438 \u0434\u0435\u0442\u0435\u043a\u0446\u0438\u0438 \u043a\u043b\u0430\u0441\u0442\u0435\u0440\u043e\u0432 (Compute Shader BBoxes) */\n    float cellS=st>.5?7.:8.;\n    vec2 gI=floor(P/cellS),gC=(gI+.5)*cellS,gL=P-gC;\n    vec2 uv=(gC-vec2(R.x*.56,top+hb*.50))/hb;\n    /* 3D-\u0432\u043e\u043b\u043d\u043e\u0432\u0430\u044f \u0442\u043e\u043f\u043e\u043b\u043e\u0433\u0438\u044f \u043f\u043e\u0432\u0435\u0440\u0445\u043d\u043e\u0441\u0442\u0438 Z(x,y,t) (\u0434\u0432\u0435 \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0440\u0438\u0440\u0443\u044e\u0449\u0438\u0435 \u0433\u0430\u0443\u0441\u0441\u043e\u0432\u044b \u0432\u043e\u0440\u043e\u043d\u043a\u0438 + \u0442\u043e\u0440) */\n    float r1=length(uv-vec2(.08,0.)),r2=length(uv+vec2(.32,-.06));\n    float zH=cos(r1*14.-QT*2.4)*exp(-r1*1.4)+.75*sin(r2*11.+QT*1.8)*exp(-r2*1.6)+.35*sin(uv.x*9.-uv.y*7.);\n    float zNorm=clamp(zH*.55+.5,0.,1.);\n    /* \u041a\u0430\u043b\u0438\u0431\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0440\u0430\u0434\u0438\u0443\u0441 \u043b\u0438\u0434\u0430\u0440\u043d\u043e\u0439 \u0442\u043e\u0447\u043a\u0438 \u0438 \u0435\u0451 \u0446\u0432\u0435\u0442 \u043f\u043e \u0432\u044b\u0441\u043e\u0442\u0435 Z */\n    float ptRad=cellS*.46*smoothstep(.12,.92,zNorm);\n    float dPt=length(gL);\n    if(zNorm>.68){\n      /* \u041f\u0438\u043a\u0438 \u0432\u044b\u0441\u043e\u0442\u044b Z: \u043f\u043b\u043e\u0442\u043d\u044b\u0435 \u043a\u0432\u0430\u0434\u0440\u0430\u0442\u043d\u044b\u0435 \u0432\u043e\u043a\u0441\u0435\u043b\u0438 (INK / \u0444\u0438\u043e\u043b\u0435\u0442\u043e\u0432\u044b\u0439) \u0441 \u0442\u043e\u0447\u043a\u043e\u0439 \u0432\u043d\u0443\u0442\u0440\u0438 */\n      bool isV=max(abs(gL.x),abs(gL.y))<cellS*.44;\n      o=isV?(zNorm>.82?INK:C_PUR):PAP;\n      if(zNorm>.82&&dPt<cellS*.2)o=C_PUR;\n    }else{\n      /* \u0421\u043a\u043b\u043e\u043d\u044b \u0438 \u0434\u043e\u043b\u0438\u043d\u044b: \u043a\u0440\u0443\u0433\u043b\u043e\u0435 \u043e\u0431\u043b\u0430\u043a\u043e \u0442\u043e\u0447\u0435\u043a \u0433\u043b\u0443\u0431\u0438\u043d\u044b */\n      vec3 pCol=zNorm>.44?C_PUR:INK;\n      o=mix(PAP,pCol,smoothstep(ptRad+.6,ptRad-.6,dPt));\n    }\n    /* \u0412\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0440\u0430\u043c\u043a\u0438 \u043a\u043b\u0430\u0441\u0442\u0435\u0440\u043e\u0432 (Compute Shader Bounding Boxes 64 px) \u043d\u0430 \u0437\u043e\u043d\u0430\u0445 \u0432\u044b\u0441\u043e\u043a\u043e\u0439 \u043a\u0440\u0438\u0432\u0438\u0437\u043d\u044b */\n    float boxS=64.;vec2 bI=floor(P/boxS),bF=fract(P/boxS);\n    vec2 buv=((bI+.5)*boxS-vec2(R.x*.56,top+hb*.50))/hb;\n    float bz=cos(length(buv-vec2(.08,0.))*14.-QT*2.4)*exp(-length(buv)*1.2);\n    if(abs(bz)>.38){\n      float bEdg=max(step(bF.x,1.5/boxS),max(step(bF.y,1.5/boxS),max(step(1.-1.5/boxS,bF.x),step(1.-1.5/boxS,bF.y))));\n      float corner=step(min(min(bF.x,1.-bF.x),min(bF.y,1.-bF.y)),.12);\n      o=mix(o,bz>0.?C_PUR:INK,bEdg*corner*.9);\n    }\n    #endif\n    float bdr=max(clamp(1.5-abs(yt-top),0.,1.),clamp(1.5-abs(yt-bot),0.,1.));\n    o=mix(o,INK,bdr*.75);\n    return o*(1.-.035*(pk(floor(fc*.5)+3.)-.5));\n  }\n  #endif\n  #ifdef UP10\n  /* \u0412\u0410\u0420\u0418\u0410\u041d\u0422 C (?x=up10) \u2014 \u00ab\u041f\u0420\u041e\u0426\u0415\u0414\u0423\u0420\u041d\u0410\u042f \u0422\u041e\u041f\u041e\u041b\u041e\u0413\u0418\u042f \u0418 \u041c\u041e\u0420\u0424\u041e\u0413\u0415\u041d\u0415\u0417\u00bb (Houdini / TouchDesigner Curl-Noise Streamlines, Voronoi Geodesics, Vector Normals \u2207f):\n     U5M=0 (Extreme I): \u041b\u0430\u043c\u0438\u043d\u0430\u0440\u043d\u043e-\u0432\u0438\u0445\u0440\u0435\u0432\u044b\u0435 \u043b\u0438\u043d\u0438\u0438 \u0442\u043e\u043a\u0430 (Curl-Noise Flowlines), \u0437\u0430\u043a\u0440\u0443\u0447\u0438\u0432\u0430\u044e\u0449\u0438\u0435\u0441\u044f \u0432\u043e\u043a\u0440\u0443\u0433 4 \u0430\u043a\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u0432\u0438\u0445\u0440\u0435\u0439 (4 \u0447\u0430\u0441\u0442\u0438 \u043a\u0443\u0440\u0441\u0430).\n     U5M=1 (Extreme II): \u041a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0433\u0435\u043e\u0434\u0435\u0437\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0442\u0440\u0438\u0430\u043d\u0433\u0443\u043b\u044f\u0446\u0438\u044f / \u0434\u0438\u0430\u0433\u0440\u0430\u043c\u043c\u0430 \u0412\u043e\u0440\u043e\u043d\u043e\u0433\u043e \u0441 \u043f\u0440\u0435\u043b\u043e\u043c\u043b\u0435\u043d\u0438\u0435\u043c \u0432\u0435\u043a\u0442\u043e\u0440\u043d\u044b\u0445 \u0438\u0437\u043e\u043b\u0438\u043d\u0438\u0439 \u0432 \u043a\u0430\u0436\u0434\u043e\u0439 \u044f\u0447\u0435\u0439\u043a\u0435 (\u2116 182 \u0412\u0435\u043d\u0435\u0446\u043a\u0438 \u00d7 TD).\n     U5M=2 (\u041f\u0430\u043a\u0435\u0442 I+II): \u041d\u0435\u043f\u0440\u0435\u0440\u044b\u0432\u043d\u044b\u0439 \u043c\u043e\u0440\u0444\u043e\u0433\u0435\u043d\u0435\u0437: \u043f\u043b\u0430\u0432\u043d\u044b\u0435 \u0432\u0438\u0445\u0440\u0435\u0432\u044b\u0435 \u043b\u0438\u043d\u0438\u0438 \u0442\u043e\u043a\u0430 \u0437\u0432\u0443\u043a\u0430 I (\u0441\u043b\u0435\u0432\u0430, \u0437\u0435\u043b\u0451\u043d\u044b\u0439) \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0438\u0437\u0443\u044e\u0442\u0441\u044f \u0432 \u043f\u043e\u043b\u0438\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0435 \u0433\u0440\u0430\u043d\u0438 \u0441\u0432\u0435\u0442\u0430 II (\u0441\u043f\u0440\u0430\u0432\u0430, \u043a\u0430\u0440\u043c\u0438\u043d).\n     U5M=3 (GLSL): \u0422\u043e\u043f\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0448\u0435\u0439\u0434\u0435\u0440 \u0441 \u0434\u043e\u043c\u0435\u043d\u043d\u043e\u0439 \u0434\u0435\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0435\u0439 (Domain Warping) + \u0440\u0435\u0433\u0443\u043b\u044f\u0440\u043d\u043e\u0435 \u043f\u043e\u043b\u0435 \u0432\u0435\u043a\u0442\u043e\u0440\u043e\u0432 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442\u0430 \u2207f (\u0441\u0442\u0440\u0435\u043b\u043a\u0438 \u043d\u043e\u0440\u043c\u0430\u043b\u0435\u0439 \u0432 \u043a\u043b\u0435\u0442\u043a\u0430\u0445 20 px). */\n  { vec2 P=vec2(x,yt);float st=QU.z,xc=QZ.x;vec3 o=PAP;\n    #if U5M==0\n    vec3 C_GRN=QS1;\n    /* \u041b\u0430\u043c\u0438\u043d\u0430\u0440\u043d\u043e-\u0432\u0438\u0445\u0440\u0435\u0432\u043e\u0435 \u043f\u043e\u043b\u0435 \u043b\u0438\u043d\u0438\u0439 \u0442\u043e\u043a\u0430 (Curl-Noise Advection \u0432\u043e\u043a\u0440\u0443\u0433 4 \u0432\u0438\u0445\u0440\u0435\u0432\u044b\u0445 \u044f\u0434\u0435\u0440) */\n    vec2 uv=(P-vec2(R.x*.5,top+hb*.5))/hb;\n    float psi=uv.y*2.4; /* \u0431\u0430\u0437\u043e\u0432\u0430\u044f \u0444\u0443\u043d\u043a\u0446\u0438\u044f \u0442\u043e\u043a\u0430 (\u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0439 \u043f\u043e\u0442\u043e\u043a) */\n    for(int k=0;k<4;k++){\n      float fk=float(k),vx=((fk-1.5)*.42)*(R.x/hb)*.5,vy=sin(fk*2.1+QT*.6)*.22;\n      vec2 d=uv-vec2(vx,vy);float r2=dot(d,d)+.025;\n      float sgn=mod(fk,2.)<.5?1.:-1.;\n      /* \u0412\u043a\u043b\u0430\u0434 \u0432\u0438\u0445\u0440\u044f \u0432 \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0442\u043e\u043a\u0430 \u03c8(x,y) \u0438 \u0440\u0430\u0434\u0438\u0430\u043b\u044c\u043d\u0430\u044f \u0437\u0432\u0443\u043a\u043e\u0432\u0430\u044f \u043f\u0443\u043b\u044c\u0441\u0430\u0446\u0438\u044f */\n      psi+=sgn*.26*log(r2)*(1.+.3*sin(QT*3.14159+fk*1.57));\n    }\n    /* \u0418\u0437\u043e\u043b\u0438\u043d\u0438\u0438 \u0444\u0443\u043d\u043a\u0446\u0438\u0438 \u0442\u043e\u043a\u0430 \u03c8 = const \u2014 \u044d\u0442\u043e \u0438 \u0435\u0441\u0442\u044c \u043d\u0435\u043f\u0440\u0435\u0440\u044b\u0432\u043d\u044b\u0435 \u043b\u0438\u043d\u0438\u0438 \u0442\u043e\u043a\u0430 \u0436\u0438\u0434\u043a\u043e\u0441\u0442\u0438/\u0437\u0432\u0443\u043a\u0430! */\n    float freq=16.,vStream=psi*freq-QT*1.2;\n    float sIdx=floor(vStream),sF=fract(vStream);\n    /* \u0421\u043a\u043e\u0440\u043e\u0441\u0442\u044c \u043f\u043e\u0442\u043e\u043a\u0430 |\u2207\u03c8| \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u0435\u0442 \u043f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c \u0438 \u0446\u0432\u0435\u0442 \u0436\u0433\u0443\u0442\u0430 */\n    float speed=clamp(abs(sin(uv.x*3.5+psi*1.8))*1.2,0.,1.);\n    float lw=mix(.22,.68,speed);\n    float ln=u2ln(sF,lw,8.);\n    /* \u0412\u0434\u043e\u043b\u044c \u0431\u044b\u0441\u0442\u0440\u044b\u0445 \u0432\u0438\u0445\u0440\u0435\u0432\u044b\u0445 \u0436\u0433\u0443\u0442\u043e\u0432 \u2014 \u0437\u0435\u043b\u0451\u043d\u044b\u0435 \u043a\u0432\u0430\u043d\u0442\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u043f\u0430\u043a\u0435\u0442\u044b \u0447\u0430\u0441\u0442\u0438\u0446 (Houdini POP grains) */\n    float pGrain=step(.58,sin(uv.x*18.-QT*6.+sIdx*2.3))*step(.42,speed);\n    if(speed>.58&&mod(sIdx,3.)<.5){\n      o=mix(C_GRN,INK,ln);\n    }else if(pGrain>.5){\n      o=mix(PAP,C_GRN,u2ln(sF,.75,8.));\n      o=mix(o,INK,step(abs(sF-.5),.18));\n    }else{\n      o=mix(PAP,INK,ln);\n    }\n\n    #elif U5M==1\n    vec3 C_RED=QS1;\n    /* \u041f\u0440\u043e\u0446\u0435\u0434\u0443\u0440\u043d\u0430\u044f \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0442\u043e\u043f\u043e\u043b\u043e\u0433\u0438\u044f \u0412\u043e\u0440\u043e\u043d\u043e\u0433\u043e (\u2116 182 \u0412\u0435\u043d\u0435\u0446\u043a\u0438 \u00d7 Houdini Voronoi Fracture): \u0432 \u043a\u0430\u0436\u0434\u043e\u0439 \u044f\u0447\u0435\u0439\u043a\u0435 \u0441\u0432\u043e\u0439 \u0443\u0433\u043e\u043b \u0438 \u0448\u0430\u0433 \u043b\u0430\u0437\u0435\u0440\u043d\u043e\u0433\u043e \u0440\u0430\u0441\u0442\u0440\u0430 */\n    float scaleV=hb*(st>.5?.26:.28);\n    vec2 gv=P/scaleV,iv=floor(gv),fv=fract(gv);\n    float d1=8.,d2=8.;vec2 id1=vec2(0.),p1=vec2(0.);\n    for(int y=-1;y<=1;y++)for(int x0=-1;x0<=1;x0++){\n      vec2 nb=vec2(float(x0),float(y)),id=iv+nb;\n      vec2 h=vec2(pk(id*1.3+1.1),pk(id*2.7+3.3));\n      vec2 pt=nb+.5+.38*sin(h*6.28318+QT*.45);\n      float d=length(fv-pt);\n      if(d<d1){d2=d1;d1=d;id1=id;p1=fv-pt;}else if(d<d2){d2=d;}\n    }\n    float edge=(d2-d1)*scaleV; /* \u0440\u0430\u0441\u0441\u0442\u043e\u044f\u043d\u0438\u0435 \u0434\u043e \u0440\u0435\u0431\u0440\u0430 \u044f\u0447\u0435\u0439\u043a\u0438 \u0412\u043e\u0440\u043e\u043d\u043e\u0433\u043e \u0432 px */\n    float ch=pk(id1*3.1+7.);\n    /* \u0423\u0433\u043e\u043b \u043f\u0440\u0435\u043b\u043e\u043c\u043b\u0435\u043d\u0438\u044f \u0432\u043d\u0443\u0442\u0440\u0438 \u0433\u0440\u0430\u043d\u0438 \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0430 */\n    float ang=floor(ch*6.)*(3.1415926/6.);\n    vec2 dir=vec2(cos(ang),sin(ang)),ortho=vec2(-dir.y,dir.x);\n    float proj=dot(P,dir),pitch=mix(5.5,11.,pk(id1*5.7));\n    float str=u2ln(proj/pitch+QT*.3*(ch>.5?1.:-1.),mix(.32,.58,ch),pitch);\n    if(ch>.68){\n      /* \u041a\u0430\u0440\u043c\u0438\u043d\u043d\u0430\u044f \u0433\u0440\u0430\u043d\u044c \u0441 \u0447\u0451\u0440\u043d\u044b\u043c\u0438 \u0438\u043b\u0438 \u0431\u0443\u043c\u0430\u0436\u043d\u044b\u043c\u0438 \u043f\u0440\u0435\u043b\u043e\u043c\u043b\u0451\u043d\u043d\u044b\u043c\u0438 \u043f\u043e\u043b\u043e\u0441\u0430\u043c\u0438 */\n      o=mix(C_RED,mod(floor(ch*12.),2.)<.5?INK:PAP,str);\n    }else if(ch>.36){\n      /* \u0413\u0440\u0430\u043d\u044c \u0441 2D-\u0440\u0435\u0448\u0451\u0442\u043a\u043e\u0439 \u043b\u0430\u0437\u0435\u0440\u043d\u043e\u0439 \u0434\u0438\u0444\u0440\u0430\u043a\u0446\u0438\u0438 */\n      float str2=u2ln(dot(P,ortho)/pitch,.35,pitch);\n      o=mix(PAP,INK,abs(str-str2));\n      if(str>.5&&str2>.5)o=C_RED;\n    }else{\n      /* \u0413\u0440\u0430\u0432\u044e\u0440\u043d\u0430\u044f \u0433\u0440\u0430\u043d\u044c */\n      o=mix(PAP,INK,str);\n    }\n    /* \u041e\u0441\u0442\u0440\u044b\u0435 \u0440\u0451\u0431\u0440\u0430 \u0433\u0440\u0430\u043d\u0435\u0439 \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0430 (2 px \u0447\u0435\u0440\u043d\u0438\u043b\u0430\u043c\u0438 \u0441 \u0431\u0443\u043c\u0430\u0436\u043d\u043e\u0439 \u043e\u0442\u0431\u0438\u0432\u043a\u043e\u0439) */\n    o=mix(o,PAP,clamp(3.2-edge,0.,1.)*.85);\n    o=mix(o,INK,clamp(1.6-edge,0.,1.));\n\n    #elif U5M==2\n    vec3 C_GRN=QS1,C_RED=QS2;\n    /* \u041c\u043e\u0440\u0444\u043e\u0433\u0435\u043d\u0435\u0437 \u041f\u0430\u043a\u0435\u0442\u0430 I + II: \u0441\u043b\u0435\u0432\u0430 \u2014 \u043f\u043b\u0430\u0432\u043d\u044b\u0435 \u0430\u043a\u0443\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u043b\u0438\u043d\u0438\u0438 \u0442\u043e\u043a\u0430 I (\u0437\u0435\u043b\u0451\u043d\u044b\u0439), \u043a \u00ab+\u00bb \u0438 \u0432\u043f\u0440\u0430\u0432\u043e \u2014 \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0438\u0437\u0430\u0446\u0438\u044f \u0432 \u0433\u0440\u0430\u043d\u0451\u043d\u0443\u044e \u0440\u0435\u0448\u0451\u0442\u043a\u0443 II (\u043a\u0430\u0440\u043c\u0438\u043d) */\n    float kryst=smoothstep(xc-hb*.55,xc+hb*.25,x); /* 0 = \u0447\u0438\u0441\u0442\u0430\u044f \u0432\u043e\u043b\u043d\u0430 I, 1 = \u0447\u0438\u0441\u0442\u044b\u0439 \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b II */\n    /* \u041a\u043e\u043e\u0440\u0434\u0438\u043d\u0430\u0442\u0430 P \u0441\u0442\u0443\u043f\u0435\u043d\u0447\u0430\u0442\u043e \u043a\u0432\u0430\u043d\u0442\u0443\u0435\u0442\u0441\u044f \u043d\u0430 \u043f\u043e\u043b\u0438\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0435 \u0434\u043e\u043c\u0435\u043d\u044b \u043f\u043e \u043c\u0435\u0440\u0435 \u0440\u043e\u0441\u0442\u0430 kryst */\n    float domS=hb*.24;\n    vec2 dId=floor(P/domS),dCtr=(dId+.5)*domS;\n    float dAng=(pk(dId*2.3)-.5)*1.4*kryst;\n    vec2 P_warped=mix(P,dCtr+mat2(cos(dAng),-sin(dAng),sin(dAng),cos(dAng))*(P-dCtr),kryst);\n    /* \u041d\u0435\u043f\u0440\u0435\u0440\u044b\u0432\u043d\u0430\u044f \u0432\u043e\u043b\u043d\u043e\u0432\u0430\u044f \u0444\u0430\u0437\u0430 \u0442\u0435\u0447\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u0434\u0435\u0444\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0435 \u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0441\u0442\u0432\u043e */\n    vec2 uv=(P_warped-vec2(xc,top+hb*.5))/hb;\n    float wave=uv.y*12.+sin(uv.x*5.5-QT*2.)*2.4+cos(uv.x*11.+uv.y*6.+QT*1.5)*1.2*(1.-kryst*.6);\n    float wIdx=floor(wave),wF=fract(wave);\n    float ln=u2ln(wF,mix(.35,.55,kryst),8.);\n    /* \u0412 \u0437\u043e\u043d\u0435 \u043f\u0435\u0440\u0435\u0445\u043e\u0434\u0430 (\u0432\u043e\u043a\u0440\u0443\u0433 \u00ab+\u00bb) \u043b\u0438\u043d\u0438\u0438 \u043a\u0432\u0430\u043d\u0442\u0443\u044e\u0442\u0441\u044f \u0432 \u0434\u0438\u0441\u043a\u0440\u0435\u0442\u043d\u044b\u0435 \u0438\u043c\u043f\u0443\u043b\u044c\u0441\u044b */\n    vec3 colAccent=mix(C_GRN,C_RED,kryst);\n    if(mod(wIdx,3.)<.5){\n      o=mix(colAccent,INK,ln);\n    }else if(mod(wIdx,2.)<.5&&abs(uv.y)<.38){\n      o=mix(INK,colAccent,ln);\n    }else{\n      o=mix(PAP,INK,ln);\n    }\n    /* \u041d\u0430 \u043f\u0440\u0430\u0432\u043e\u0439 \u043f\u043e\u043b\u043e\u0432\u0438\u043d\u0435 \u043f\u0440\u043e\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0436\u0451\u0441\u0442\u043a\u0438\u0435 \u0433\u0440\u0430\u043d\u0438\u0446\u044b \u0434\u043e\u043c\u0435\u043d\u043e\u0432 \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0438\u0437\u0430\u0446\u0438\u0438 */\n    if(kryst>.15){\n      vec2 df=abs(fract(P/domS)-.5)*domS;\n      float dEdg=domS*.5-max(df.x,df.y);\n      o=mix(o,PAP,clamp(2.5-dEdg,0.,1.)*kryst*.85);\n      o=mix(o,C_RED,clamp(1.3-dEdg,0.,1.)*kryst);\n    }\n\n    #else\n    vec3 C_PUR=QS1;\n    /* GLSL (U5M=3) \u00b7 \u041f\u043e\u043b\u0435 \u0432\u0435\u043a\u0442\u043e\u0440\u043e\u0432 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442\u0430 \u2207f + \u0422\u043e\u043f\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0438\u0437\u043e\u043b\u0438\u043d\u0438\u0438 \u0441 \u0434\u043e\u043c\u0435\u043d\u043d\u043e\u0439 \u0434\u0435\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0435\u0439 (Domain Warping + Vector Field) */\n    vec2 p=(P-vec2(R.x*.55,top+hb*.50))/hb;\n    /* \u0414\u0432\u0443\u0445\u0441\u0442\u0443\u043f\u0435\u043d\u0447\u0430\u0442\u044b\u0439 Domain Warping f(p + q(p)) \u0438 \u0430\u043d\u0430\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442 \u2207f */\n    vec2 q=vec2(sin(p.x*3.8+p.y*2.4+QT*.5),cos(p.y*4.2-p.x*2.9-QT*.4))*.38;\n    vec2 r=p*2.6+q+vec2(cos(q.y*5.-QT*.7),sin(q.x*5.+QT*.6))*.25;\n    float fVal=sin(r.x*3.2+cos(r.y*2.8))+cos(r.y*3.5-sin(r.x*3.1));\n    /* \u0427\u0438\u0441\u043b\u0435\u043d\u043d\u044b\u0439 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442 \u043f\u043e\u043b\u044f \u2207f \u0434\u043b\u044f \u043f\u043e\u0441\u0442\u0440\u043e\u0435\u043d\u0438\u044f \u0432\u0435\u043a\u0442\u043e\u0440\u043e\u0432 \u043d\u043e\u0440\u043c\u0430\u043b\u0435\u0439 */\n    float eps=.015;\n    vec2 rX=(p+vec2(eps,0.))*2.6+q,rY=(p+vec2(0.,eps))*2.6+q;\n    float fX=sin(rX.x*3.2+cos(rX.y*2.8))+cos(rX.y*3.5-sin(rX.x*3.1));\n    float fY=sin(rY.x*3.2+cos(rY.y*2.8))+cos(rY.y*3.5-sin(rY.x*3.1));\n    vec2 grad=vec2(fX-fVal,fY-fVal)/eps;\n    float gMag=length(grad);\n    /* 1. \u0427\u0451\u0442\u043a\u0438\u0435 \u0442\u043e\u043f\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0438\u0437\u043e\u043b\u0438\u043d\u0438\u0438 \u043f\u043e\u043b\u044f fVal \u043d\u0430 \u0447\u0438\u0441\u0442\u043e\u0439 \u0431\u0443\u043c\u0430\u0433\u0435 (\u0442\u043e\u043b\u0449\u0438\u043d\u0430 \u0441 \u043f\u043e\u043f\u0440\u0430\u0432\u043a\u043e\u0439 \u043d\u0430 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442 |\u2207f|) */\n    float nCont=3.8,vCont=fVal*nCont-QT*.25,cIdx=floor(vCont),cFrac=abs(fract(vCont)-.5)*2.;\n    float isoLn=clamp(1.5-cFrac*14.,0.,1.);\n    bool isPurBand=mod(cIdx,3.)<.5;\n    bool isInkBand=mod(cIdx,5.)<.5&&!isPurBand;\n    /* 2. \u0420\u0435\u0433\u0443\u043b\u044f\u0440\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 \u0432\u0435\u043a\u0442\u043e\u0440\u043e\u0432 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442\u0430 \u2207f (\u043a\u043b\u0435\u0442\u043a\u0430 22 px: \u043a\u0430\u043b\u0438\u0431\u0440\u043e\u0432\u0430\u043d\u043d\u0430\u044f \u0438\u0433\u043b\u0430 \u043d\u043e\u0440\u043c\u0430\u043b\u0438 + \u0442\u043e\u0447\u043a\u0430 \u043e\u0442\u0441\u0447\u0451\u0442\u0430) */\n    float vGrid=st>.5?18.:22.;\n    vec2 vCell=(floor(P/vGrid)+.5)*vGrid,vLoc=P-vCell;\n    vec2 gDir=grad/max(gMag,1e-3);\n    float vLen=vGrid*.42*clamp(gMag*.12,.28,1.);\n    float dVec=u5sg(vLoc,-gDir*vLen*.35,gDir*vLen*.65);\n    float dHead=length(vLoc-gDir*vLen*.65);\n    float vecOn=max(clamp(1.35-dVec,0.,1.),step(dHead,2.2));\n    if(isPurBand&&cFrac<.32){\n      o=mix(C_PUR,PAP,vecOn*.9);\n      o=mix(o,INK,isoLn);\n    }else if(isInkBand&&cFrac<.22){\n      o=mix(INK,C_PUR,vecOn);\n    }else{\n      o=mix(PAP,INK,isoLn*.9);\n      o=mix(o,gMag>6.?C_PUR:INK,vecOn*.82);\n    }\n    #endif\n    float bdr=max(clamp(1.5-abs(yt-top),0.,1.),clamp(1.5-abs(yt-bot),0.,1.));\n    o=mix(o,INK,bdr*.75);\n    return o*(1.-.035*(pk(floor(fc*.5)+3.)-.5));\n  }\n  #endif\n  #ifdef UP7\n  /* ?x=up7 \u2014 \u00ab\u0415\u0414\u0418\u041d\u0410\u042f \u0421\u0420\u0415\u0414\u0410\u00bb (\u043e\u0434\u043d\u043e \u043d\u0435\u043f\u0440\u0435\u0440\u044b\u0432\u043d\u043e\u0435 \u043c\u0430\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u043f\u043e\u043b\u0435 \u043d\u0430 \u0432\u0441\u044e \u043f\u043e\u043b\u043e\u0441\u0443 \u0438\u0437 2 \u043e\u043f\u043e\u0440\u043d\u044b\u0445 \u0440\u0435\u0444\u043e\u0432, \u0431\u0435\u0437 \u043d\u0430\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0445 \u0444\u0438\u0433\u0443\u0440):\n     U5M=0 (Extreme I \u00b7 \u2116 162 + \u2116 537): \u0432\u0441\u044f \u043f\u043e\u043b\u043e\u0441\u0430 \u2014 \u0435\u0434\u0438\u043d\u044b\u0439 4-\u0441\u0442\u0443\u043f\u0435\u043d\u0447\u0430\u0442\u044b\u0439 \u0441\u043a\u043b\u0430\u0434\u0447\u0430\u0442\u044b\u0439 \u0440\u0435\u043b\u044c\u0435\u0444 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0445 \u043b\u0438\u043d\u0438\u0439 (\u2116 162), \u0432\u043d\u0443\u0442\u0440\u0438 \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e \u0437\u0432\u0443\u043a\u043e\u0432\u0430\u044f \u0432\u043e\u043b\u043d\u0430\n           \u043a\u0432\u0430\u043d\u0442\u0443\u0435\u0442 \u0441\u0430\u043c\u0438 \u043b\u0438\u043d\u0438\u0438 \u0432 14 px \u0431\u0438\u043d\u0430\u0440\u043d\u0443\u044e \u043c\u0430\u0442\u0440\u0438\u0446\u0443 \u0438 \u0441\u0442\u043e\u0445\u0430\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0440\u0430\u0441\u0442\u0440 (\u2116 537).\n     U5M=1 (Extreme II \u00b7 \u2116 594 + \u2116 162): \u0432\u0441\u044f \u043f\u043e\u043b\u043e\u0441\u0430 \u043e\u0442 \u043a\u0440\u0430\u044f \u0434\u043e \u043a\u0440\u0430\u044f \u2014 \u0435\u0434\u0438\u043d\u0430\u044f \u0433\u0440\u0430\u043d\u0451\u043d\u0430\u044f \u043e\u043f\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0432\u043e\u0440\u043e\u043d\u043a\u0430-\u04    float tN=(sig-.26)/.26,dth=b8(floor(fc/1.5))*.65+pk(floor(fc/1.5))*.35;\n      vec3 baseC=step(dth,tN*.75)>.5?C_GRN:PAP;\n      float lw=mix(.22,.58,tN);\n      o=mix(baseC,INK,u2ln(lineF,lw,pitch));\n    }else{\n      /* \u0421\u043f\u043e\u043a\u043e\u0439\u043d\u0430\u044f \u0437\u043e\u043d\u0430 \u0442\u043e\u0433\u043e \u0436\u0435 \u043f\u043e\u043b\u044f: \u0442\u043e\u043d\u043a\u0438\u0435 \u0430\u0440\u0445\u0438\u0442\u0435\u043a\u0442\u0443\u0440\u043d\u044b\u0435 \u043b\u0438\u043d\u0438\u0438 \u0441\u043e \u0441\u043a\u043b\u0430\u0434\u043a\u0430\u043c\u0438 \u043f\u043e \u0431\u0443\u043c\u0430\u0433\u0435 (\u2116 162) */\n      float lw=mix(.18,.34,sig/.26)*(onRamp>.5?1.35:1.);\n      o=mix(PAP,INK,u2ln(lineF,lw,pitch));\n    }\n\n    #elif U5M==1\n    /* EXTREME II \u00b7 \u0415\u0434\u0438\u043d\u0430\u044f \u0433\u0440\u0430\u043d\u0451\u043d\u0430\u044f \u043e\u043f\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u0440\u0435\u0434\u0430 \u043e\u0442 \u043a\u0440\u0430\u044f \u0434\u043e \u043a\u0440\u0430\u044f (\u2116 594 + \u2116 162: \u0441\u043f\u0438\u0440\u0430\u043b\u044c\u043d\u0430\u044f \u043f\u043e\u043b\u0438\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u0430\u044f \u0432\u043e\u0440\u043e\u043d\u043a\u0430 \u043f\u0440\u0435\u043b\u043e\u043c\u043b\u0435\u043d\u0438\u044f) */\n    vec3 C_RED=QS1;\n    vec2 C0=vec2(st>.5?R.x*.56:R.x*.64,top+hb*(st>.5?.46:.46));\n    vec2 dp=(P-C0)/hb;dp.x*=.78; /* \u043c\u0430\u0441\u0448\u0442\u0430\u0431 \u043f\u043e \u0448\u0438\u0440\u0438\u043d\u0435, \u0447\u0442\u043e\u0431\u044b \u0435\u0434\u0438\u043d\u043e\u0435 \u043f\u043e\u043b\u0435 \u0434\u0435\u0440\u0436\u0430\u043b\u043e \u0432\u0441\u0435 1440 px */\n    /* \u041f\u043e\u043b\u0438\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u0430\u044f \u043c\u0435\u0442\u0440\u0438\u043a\u0430 \u0441 5 \u043e\u0441\u0442\u0440\u044b\u043c\u0438 \u0433\u0440\u0430\u043d\u044f\u043c\u0438 (\u2116 162 \u0438\u0437\u043b\u043e\u043c \u043d\u04 hellW),shF=fract((rPoly-QT*.034)/shellW);\n    /* \u0412\u043d\u0443\u0442\u0440\u0438 \u043a\u0430\u0436\u0434\u043e\u0439 \u0433\u0440\u0430\u043d\u0438 \u0441\u0432\u043e\u044f \u0447\u0430\u0441\u0442\u043e\u0442\u0430 \u0442\u043e\u043d\u043a\u0438\u0445 \u043b\u0438\u043d\u0438\u0439 (\u044d\u0444\u0444\u0435\u043a\u0442 \u043f\u0440\u0435\u043b\u043e\u043c\u043b\u0435\u043d\u0438\u044f \u2116 162 + \u043c\u0443\u0430\u0440 \u2116 594) */\n    float subN=mod(sIdx+shIdx,3.)<.5?4.:mod(sIdx,2.)<.5?3.:2.;\n    float hw=.44,vSub=fract(shF*subN),stripe=clamp(hw*4.-abs(vSub-.5)*8.+.5,0.,1.);\n    /* \u0415\u0434\u0438\u043d\u043e\u0435 \u044f\u0434\u0440\u043e \u0437\u0430\u0442\u043c\u0435\u043d\u0438\u044f \u0432 \u0446\u0435\u043d\u0442\u0440\u0435 \u0432\u043e\u0440\u043e\u043d\u043a\u0438 (\u2116 594) */\n    float coreR=st>.5?.22:.24;\n    if(r0<coreR){\n      /* \u0412\u043d\u0443\u0442\u0440\u0438 \u0447\u0451\u0440\u043d\u043e\u0433\u043e \u044f\u0434\u0440\u0430 \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u0442\u043e\u043d\u043a\u0438\u0435 \u043a\u043e\u043d\u0446\u0435\u043d\u0442\u0440\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u043a\u0430\u0443\u0441\u0442\u0438\u043a\u0438 \u043a\u0430\u0440\u043c\u0438\u043d\u0430 \u0442\u043e\u0433\u043e \u0436\u0435 \u043f\u043e\u043b\u044f */\n      float cau=clamp(1.6-abs(fract(rPoly/.028-QT*.5)-.5)*16.,0.,1.)*smoothstep(0.,coreR,r0);\n      o=mix(INK,C_RED,cau*.85);\n      o=mix(o,PAP,clamp(1.5-(coreR-r0)*hb,0.,1.));\n    }else{\n      /* \u0412\u043e\u043a\u0440\u0443\u0433 \u044f\u0434\u0440\u0430 \u2014 \u0432\u0441\u044f \u043f\u043e\u043b\u043e\u0441\u0430 \u0436\u0438\u0432\u0451\u0442 \u043a\u0430\u043a \u0435\u0434\u0438\u043d\u044b\u0439 \u0441\u043f\u0438\u0440\u0430\u043b\u044c\u043d\u044b\u0439 \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b \u0438\u0437 \u0447\u0435\u0440\u0435\u0434\u0443\u044e\u0449\u0438\u0445\u0441\u044f \u043e\u0431\u043e\u043b\u043e\u0447\u0435\u043a */\n      float m4=mod(shIdx+sIdx,4.);\n      if(m4<.5){\n        /* \u041a\u0430\u0440\u043c\u0438\u043d\u043d\u0430\u044f \u0433\u0440\u0430\u043d\u044c \u0441 \u0447\u0451\u0440\u043d\u044b\u043c\u0438 \u043f\u0440\u0435\u043b\u043e\u043c\u043b\u0451\u043d\u043d\u044b\u043c\u0438 \u043f\u043e\u043b\u043e\u0441\u0430\u043c\u0438 */\n        o=mix(C_RED,INK,stripe*.85);\n      }else if(m4<1.5){\n        /* \u0413\u043b\u0443\u0431\u043e\u043a\u0430\u044f \u0447\u0451\u0440\u043d\u0430\u044f \u0433\u0440\u0430\u043d\u044c \u0441 \u043a\u0430\u0440\u043c\u0438\u043d\u043d\u044b\u043c\u0438 \u0438\u043b\u0438 \u0431\u0443\u043c\u0430\u0436\u043d\u044b\u043c\u0438 \u043b\u0438\u043d\u0438\u044f\u043c\u0438 (\u2116 594) */\n        o=mix(INK,mod(sIdx,2.)<.5?C_RED:PAP,stripe);\n      }else if(m4<2.5){\n        /* \u0421\u0432\u0435\u0442\u043b\u0430\u044f \u0433\u0440\u0430\u043d\u044c \u0441 \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0440\u0435\u043d\u0446\u0438\u043e\u043d\u043d\u044b\u043c \u043c\u0443\u0430\u0440\u043e\u043c (\u2116 594) */\n        float moire=step(0.,sin(dp.x*hb*.22)*sin(rPoly*hb*.28-QT*3.14159));\n        o=mix(PAP,mod(shIdx,2.)<.5?INK:C_RED,stripe*mix(.55,1.,moire));\n      }else{\n        /* \u0421\u043f\u043e\u043a\u043e\u0439\u043d\u0430\u044f \u0431\u0443\u043c\u0430\u0436\u043d\u0430\u044f \u0433\u0440\u0430\u043d\u044c \u0441 \u0447\u0451\u0442\u043a\u043e\u0439 \u0433\u0440\u0430\u0432\u044e\u0440\u043d\u043e\u0439 \u0448\u0442\u0440\u0438\u0445\u043e\u0432\u043a\u043e\u0439 (\u2116 162) */\n        o=mix(PAP,INK,stripe*.78);\n      }\n      /* \u0422\u043e\u043d\u043a\u0430\u044f \u0431\u0443\u043c\u0430\u0436\u043d\u0430\u044f \u0444\u0430\u0441\u043a\u0430 \u043d\u0430 5 \u043e\u0441\u0442\u0440\u044b\u0445 \u0440\u0451\u0431\u0440\u0430\u0445 \u043f\u0440\u0435\u043b\u043e\u043c\u043b\u0435\u043d\u0438\u044f \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0430 */\n      o=mix(o,PAP,clamp(1.6-edgeDist,0.,1.)*.75);\n    }\n\n    #elif U5M==2\n    /* \u041f\u0410\u041a\u0415\u0422 EXTREME I + II \u00b7 \u0415\u0434\u0438\u043d\u043e\u0435 \u0442\u0435\u043a\u0442\u043e\u043d\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u043f\u043e\u043b\u0435 \u0441\u043e \u0441\u0434\u0432\u0438\u0433\u043e\u043c \u043f\u043b\u0430\u0441\u0442\u043e\u0432 \u043f\u043e\u0434 26\u00b0 (\u2116 537 + \u2116 659) \u043d\u0430 \u0432\u0441\u044e \u0448\u0438\u0440\u0438\u043d\u0443 \u043f\u043e\u043b\u043e\u0441\u044b */\n    vec3 C_GRN=QS1,C_RED=QS2;\n    /* \u0415\u0434\u0438\u043d\u0430\u044f \u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u044c\u043d\u0430\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u043a\u043e\u043e\u0440\u0434\u0438\u043d\u0430\u0442 \u043f\u043e\u0434 26\u00b0 (\u2116 659) \u0447\u0435\u0440\u0435\u0437 \u0446\u0435\u043d\u0442\u0440 \u00ab+\u00bb (xc) */\n    vec2 C0=vec2(st>.5?R.x*.52:xc,top+hb*.50);\n    mat2 Rd=mat2(.8988,-.4384,.4384,.8988);\n    vec2 dp=Rd*(P-C0);\n    /* \u0412\u0441\u044f \u043f\u043e\u043b\u043e\u0441\u0430 \u043d\u0430\u0440\u0435\u0437\u0430\u043d\u0430 \u043d\u0430 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0435 \u0442\u0435\u043a\u0442\u043e\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u043f\u043b\u0430\u0441\u0442\u044b (\u2116 659), \u0441\u043a\u043e\u043b\u044c\u0437\u044f\u0449\u0438\u0435 \u0432\u0434\u043e\u043b\u044c \u0440\u0430\u0437\u043b\u043e\u043c\u043e\u0432 \u0432 \u0442\u0430\u043a\u0442 */\n    float slH=hb*(st>.5?.16:.155),sk=floor(dp.y/slH),sf=fract(dp.y/slH);\n    float shA=(pk(vec2(sk,bt-1.+5.))-.5)*hb*.38,shB=(pk(vec2(sk,bt+5.))-.5)*hb*.38;\n    float shift=mix(shA,shB,be7)+(mod(sk,2.)<.5?1.:-1.)*hb*.16;\n    vec2 sp=vec2(dp.x-shift,dp.y);\n    /* \u0415\u0434\u0438\u043d\u0430\u044f \u043d\u0435\u043f\u0440\u0435\u0440\u044b\u0432\u043d\u0430\u044f \u0432\u043e\u043b\u043d\u0430-\u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442 (\u2116 537) \u0434\u0435\u043b\u0438\u0442 \u0441\u0434\u0432\u0438\u043d\u0443\u0442\u043e\u0435 \u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0441\u0442\u0432\u043e \u043d\u0430 \u0421\u0440\u0435\u0434\u0443 I (\u0437\u0432\u0443\u043a/\u043c\u0430\u0442\u0440\u0438\u0446\u0430) \u0438 \u0421\u0440\u0435\u0434\u0443 II (\u0441\u0432\u0435\u0442/\u0440\u0430\u0441\u0442\u0440) */\n    float waveH=sin(sp.x/(hb*.55)-QT*.8)*hb*.22+cos(sp.x/(hb*.24)+QT*1.6)*hb*.08;\n    float distH=sp.y-waveH+sp.x*.28; /* < 0 \u2014 \u0421\u0440\u0435\u0434\u0430 I (\u0432\u0435\u0440\u0445/\u043b\u0435\u0432\u043e), >= 0 \u2014 \u0421\u0440\u0435\u0434\u0430 II (\u043d\u0438\u0437/\u043f\u0440\u0430\u0432\u043e) */\n    float gS=st>.5?12.:14.;\n    if(distH<0.){\n      /* \u0421\u0420\u0415\u0414\u0410 I (\u041a\u0443\u0440\u0441 I, \u2116 537 \u0432\u0435\u0440\u0445): \u0435\u0434\u0438\u043d\u043e\u0435 \u043c\u0430\u0442\u0440\u0438\u0447\u043d\u043e\u0435 \u043f\u043e\u043b\u0435 \u2014 \u043f\u043b\u043e\u0442\u043d\u043e\u0441\u0442\u044c \u043e\u0442 \u0440\u0430\u0441\u0441\u0442\u043e\u044f\u043d\u0438\u044f \u0434\u043e \u0432\u043e\u043b\u043d\u043e\u0432\u043e\u0433\u043e \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430 */\n      float depth=clamp(-distH/(hb*.75),0.,1.);\n      vec2 gi=floor(sp/gS),gf=fract(sp/gS);\n      float grid=max(step(gf.x,1.25/gS),step(gf.y,1.25/gS));\n      float hC=pk(gi*.37+floor(QT*2.)*.13);\n      /* \u0412\u0431\u043b\u0438\u0437\u0438 \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430 \u0440\u0430\u0437\u043b\u043e\u043c\u0430 \u2014 \u0433\u043b\u0443\u0431\u043e\u043a\u0438\u0439 \u0447\u0451\u0440\u043d\u043e-\u0437\u0435\u043b\u0451\u043d\u044b\u0439 \u043c\u0430\u0442\u0440\u0438\u0447\u043d\u044b\u0439 \u043c\u0430\u0441\u0441\u0438\u0432 \u0441 \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u043c\u0438 \u0441\u043f\u0435\u043a\u0442\u0440\u0430\u043c\u0438; \u043a \u043b\u0435\u0432\u043e\u043c\u0443 \u043a\u0440\u0430\u044e \u2014 \u0441\u0432\u0435\u0442\u043b\u0435\u0435 */\n      if(depth<.62){\n        float cellOn=step(.35+depth*.3,hC)*step(length(gf-.5),.32);\n        vec3 c1=mix(INK,C_GRN,max(grid*.55,cellOn));\n        /* \u041a\u0432\u0430\u043d\u0442\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u0438\u043c\u043f\u0443\u043b\u044c\u0441\u044b \u0432\u0434\u043e\u043b\u044c \u043a\u043e\u043b\u043e\u043d\u043e\u043a \u043c\u0430\u0442\u0440\u0438\u0446\u044b (\u2116 537) */\n        float pulse=step(.62,sin(gi.x*.45-QT*3.14159+sk*1.2))*step(abs(gf.x-.5),.24);\n        c1=mix(c1,mod(gi.x,3.)<.5?C_RED:C_GRN,pulse*(1.-depth));\n        o=c1;\n      }else{\n        /* \u0412\u043d\u0435\u0448\u043d\u044f\u044f \u0437\u043e\u043d\u0430 \u0442\u043e\u0439 \u0436\u0435 \u043c\u0430\u0442\u0440\u0438\u0446\u044b \u043d\u0430 \u0431\u0443\u043c\u0430\u0433\u0435 \u2014 \u0435\u0434\u0438\u043d\u0430\u044f \u0441\u0435\u0442\u043a\u0430 \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0435\u0442\u0441\u044f \u0431\u0435\u0437 \u0440\u0430\u0437\u0440\u044b\u0432\u0430 */\n        float dotP=step(.55,hC)*step(length(gf-.5),.22);\n        o=mix(PAP,mix(INK,C_GRN,step(.75,hC)),max(grid*.45,dotP));\n      }\n    }else{\n      /* \u0421\u0420\u0415\u0414\u0410 II (\u041a\u0443\u0440\u0441 II, \u2116 537 \u043d\u0438\u0437): \u0442\u0430 \u0436\u0435 \u0432\u043e\u043b\u043d\u0430 \u043f\u043e \u0434\u0440\u0443\u0433\u0443\u044e \u0441\u0442\u043e\u0440\u043e\u043d\u0443 \u0440\u0430\u0437\u043b\u043e\u043c\u0430 \u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0441\u044f \u0441\u0442\u043e\u0445\u0430\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u0440\u0430\u0441\u0442\u0440\u043e\u043c \u0438 \u043e\u043f-\u0430\u0440\u0442 \u043f\u043e\u043b\u0435\u043c \u043a\u0430\u0440\u043c\u0438\u043d\u0430 */\n      float depth=clamp(distH/(hb*.68),0.,1.);\n      float dth=b8(floor(fc/1.5))*.62+pk(floor(fc/1.5)+floor(QT*4.)*.1)*.38;\n      /* \u041d\u0435\u043f\u0440\u0435\u0440\u044b\u0432\u043d\u044b\u0439 \u043f\u0435\u0440\u0435\u0445\u043e\u0434 \u043e\u0442 \u04 const qb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const progs = {};
function getProg(seriesId, u5m) {
  const key = seriesId + '_' + u5m;
  if (progs[key]) return progs[key];
  let defs = '#define UP 1\n#define UP2 1\n#define UP3 1\n#define UP5 1\n#define U5M ' + u5m + '\n#define UP6 1\n#define UP7 1\n';
  if (seriesId !== 'up7') defs += '#define ' + seriesId.toUpperCase() + ' 1\n';

  const fsSrc = `precision highp float;
${defs}
uniform sampler2D T;
uniform vec2 R;
float b2(vec2 a){a=floor(a);return fract(dot(a,vec2(.5,a.y*.75)));}
float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
float b8(vec2 a){return b4(.5*a)*.25+b2(a);}
float pk(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}
` + U2G_BODY + `
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec3 PAP = vec3(.914,.906,.878);
  gl_FragColor = vec4(up2post(PAP, fc, 1.), 1.);
}`;

  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, fsSrc); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error(key, gl.getShaderInfoLog(fs));
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  progs[key] = p;
  return p;
}

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const stage = $('stage'), band = $('band'), cv = $('cv'), ctx = cv.getContext('2d');
const logo = $('logo'), pwrap = $('pwrap'), pfr = $('pfr');
let idx = 0, T = 0, last = performance.now();
let mx = RW * .58, my = RH * .44, mh = 0, smx = RW * .58, smy = RH * .44, smh = .5;
let pointerAt = 0, wheelLock = 0, playing = false, playTimer = null;
let shownPath = '', railKind = null;

/* The band keeps the native aspect of what it shows: 3.2 : 1 for a series strip
   (a taller 1.15 crop on phones), 1440 x 900 for a live page cover. */
function pageViewport() {
  return window.innerWidth < 760 ? [390, 844] : [1440, 900];
}
function layout() {
  const frame = $('frame'), main = $('main');
  const it = SLIDES[idx];
  const isPage = it.kind === 'page';
  const pv = pageViewport();
  const target = isPage ? pv[0] / pv[1] : (window.innerWidth < 760 ? 1.15 : 3.2);
  const chrome = frame.offsetHeight - stage.offsetHeight;
  const avail = Math.max(90, main.clientHeight - chrome - 10);
  let w = frame.clientWidth, h = w / target;
  if (h > avail) { h = avail; w = h * target; }
  w = Math.max(160, Math.floor(w)); h = Math.max(80, Math.round(h));
  band.style.width = w + 'px';
  band.style.height = h + 'px';
  stage.style.height = h + 'px';

  if (isPage) {
    if (pfr.width !== pv[0]) {
      pfr.width = pv[0]; pfr.height = pv[1];
      pfr.style.width = pv[0] + 'px'; pfr.style.height = pv[1] + 'px';
      if (shownPath) { pfr.src = shownPath; }
    }
    pfr.style.transform = 'scale(' + (w / pv[0]) + ')';
  } else {
    const nextRH = Math.max(120, Math.round(RW * h / w));
    if (nextRH !== RH || cv.width !== RW) {
      RH = nextRH;
      gc.width = RW; gc.height = RH;
      cv.width = RW; cv.height = RH;
      smx = RW * .58; smy = RH * .44;
    }
  }
  fitLogo();
  const f = document.getElementById('fps');
  if (f) f.textContent = isPage ? 'live page · 1440 × 900' : 'webgl · ' + RW + ' × ' + RH;
}

const mc = document.createElement('canvas').getContext('2d');
/* Place the wordmark by its real glyph metrics: font-size from the band width,
   baseline gap from the band bottom. No clipping, no guessing at line-height. */
function fitLogo() {
  const bw = band.clientWidth || 1200, bh = band.clientHeight || 375;
  const text = logo.textContent || 'EXTREME I';
  const maxW = bw * .90;
  let fs = bh * .56;
  const setFont = () => { mc.font = '400 ' + fs + 'px "H2T Bebas", Impact, "Arial Narrow", sans-serif'; };
  setFont();
  let m = mc.measureText(text);
  if (m.width > maxW) { fs = fs * maxW / m.width; setFont(); m = mc.measureText(text); }
  logo.style.fontSize = fs.toFixed(1) + 'px';
  const asc = m.fontBoundingBoxAscent || fs * .9;
  const desc = m.fontBoundingBoxDescent || fs * .1;
  const half = (.82 * fs - (asc + desc)) / 2;
  const baseline = half + asc;
  const glyphBottom = baseline + (m.actualBoundingBoxDescent || 0);
  logo.style.top = Math.round(bh - Math.max(3, bh * .035) - glyphBottom) + 'px';
}

/* ---------- rendering ---------- */
function draw() {
  const it = SLIDES[idx];
  if (it.kind !== 'series') return;
  const p = getProg(it.s.id, it.c.u5m);
  gl.useProgram(p);
  const L = n => gl.getUniformLocation(p, n);
  const lp = gl.getAttribLocation(p, 'p');
  if (lp >= 0) { gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0); }

  gl.viewport(0, 0, RW, RH);
  gl.uniform2f(L('R'), RW, RH);
  gl.uniform4f(L('QP'), 0.27, 0.64, -10.0, RH + 10.0);
  gl.uniform1f(L('QT'), T);
  gl.uniform3fv(L('QS1'), it.c.s1);
  gl.uniform3fv(L('QS2'), it.c.s2);
  gl.uniform1f(L('QA'), it.c.u5m === 2 ? 1.0 : 0.0);
  gl.uniform4f(L('QZ'), RW * it.c.xc, RH * 0.30, RH * 0.92, RW * (it.c.u5m === 3 ? 0.38 : 0.94));
  gl.uniform4f(L('QU'), 0.72, RW * 0.038, 0.0, RW * it.c.xc);
  gl.uniform4f(L('QV'), 60.0, RW * (it.c.xc - 0.13), RW * 0.08, 7.0);
  gl.uniform4f(L('QW'), RW * 0.972, 9.0, RW * 0.5, -1.0);
  gl.uniform4f(L('QM'), smx, smy, smh, 0.0);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.drawImage(gc, 0, 0);
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; T += dt;

  const idle = now - pointerAt > 2200;
  const autoX = RW * (0.56 + 0.26 * Math.cos(T * 0.7));
  const autoY = RH * (0.45 + 0.25 * Math.sin(T * 0.9));
  const tx = (!idle && mh > 0.05) ? mx : autoX;
  const ty = (!idle && mh > 0.05) ? my : autoY;
  smx += (tx - smx) * 0.14;
  smy += (ty - smy) * 0.14;
  smh += ((idle ? 0.45 : Math.max(mh, 0.7)) - smh) * 0.12;
  mh *= 0.94;

  draw();
  requestAnimationFrame(frame);
}

/* ---------- live page covers ---------- */
pfr.addEventListener('load', () => pwrap.classList.remove('loading'));

function showPage(p) {
  if (shownPath !== p.path) {
    shownPath = p.path;
    pwrap.classList.add('loading');
    pfr.src = p.path;
  }
}

/* ---------- navigation ---------- */
function update(hash = true) {
  const it = SLIDES[idx];
  const isPage = it.kind === 'page';
  band.classList.toggle('is-page', isPage);
  layout();
  $('num').textContent = String(idx + 1).padStart(2, '0');
  $('total').textContent = SLIDES.length;
  $('open').hidden = !isPage;

  if (isPage) {
    const p = it.p;
    $('kick').textContent = p.grpLabel;
    $('cname').textContent = p.tag;
    $('title').textContent = p.word;
    $('sub').innerHTML = '<code>' + p.path + '</code>';
    $('open').href = p.path;
    $('badge').textContent = '';
    $('grp').textContent = '';
    logo.textContent = p.word;
    showPage(p);
    document.title = 'Hou2Touch — ' + p.word + ' · ' + p.path;
  } else {
    $('badge').innerHTML = '?x=' + it.s.id + ' &middot; ' + it.c.slug;
    $('grp').textContent = it.s.kicker;
    $('kick').textContent = it.s.kicker;
    $('cname').textContent = it.c.title;
    $('title').innerHTML = it.s.title;
    $('sub').innerHTML = it.s.sub;
    logo.textContent = it.c.title;
    document.title = 'Hou2Touch — ' + it.s.title.replace(/&amp;/g, '&') + ' · ' + it.c.title;
  }

  $('fill').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
  $('jump').value = String(idx);

  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === (isPage ? 'pages' : 'series')));
  buildRail(isPage, it);

  fitLogo();
  const cap = $('cap');
  cap.classList.remove('swap'); void cap.offsetWidth; cap.classList.add('swap');
  if (hash) history.replaceState(null, '', '#' + (idx + 1));
}

function go(n) {
  idx = (n + SLIDES.length) % SLIDES.length;
  update();
}

/* ---------- rail (contextual) ---------- */
function buildRail(isPage, it) {
  const rail = $('rail');
  const kind = isPage ? 'pages' : 'series';
  if (railKind !== kind) {
    railKind = kind;
    rail.innerHTML = '';
    if (isPage) {
      ['en', 'ru', 'legacy'].forEach(g => {
        const first = PAGES.findIndex(p => p.grp === g);
        if (first < 0) return;
        const n = PAGES.filter(p => p.grp === g).length;
        const b = document.createElement('button');
        b.dataset.g = g;
        b.textContent = g + ' · ' + n;
        b.addEventListener('click', () => go(first));
        rail.appendChild(b);
      });
    } else {
      SERIES.forEach((s, si) => {
        const b = document.createElement('button');
        b.textContent = s.id;
        b.dataset.id = s.id;
        b.addEventListener('click', () => go(NP + si * COURSES.length));
        rail.appendChild(b);
      });
    }
  }
  rail.querySelectorAll('button').forEach(b => {
    if (isPage) b.classList.toggle('on', b.dataset.g === it.p.grp);
    else b.classList.toggle('on', b.dataset.id === it.s.id);
  });
}

/* ---------- UI wiring ---------- */
$('prev').addEventListener('click', () => go(idx - 1));
$('next').addEventListener('click', () => go(idx + 1));

document.querySelectorAll('#tabs button').forEach(b => {
  b.addEventListener('click', () => go(b.dataset.tab === 'pages' ? 0 : NP));
});

const jump = $('jump');
const plain = h => h.replace(/&amp;/g, '&').replace(/&eacute;/g, 'e').replace(/&rarr;/g, '>')
  .replace(/&deg;/g, 'deg').replace(/&middot;/g, '-').replace(/&[a-z]+;/g, ' ');

['en', 'ru', 'legacy'].forEach(g => {
  const og = document.createElement('optgroup');
  og.label = 'PAGES · ' + g.toUpperCase();
  PAGES.forEach((p, pi) => {
    if (p.grp !== g) return;
    const o = document.createElement('option');
    o.value = String(pi);
    o.textContent = p.word + ' · ' + p.tag;
    og.appendChild(o);
  });
  jump.appendChild(og);
});

SERIES.forEach((s, si) => {
  const og = document.createElement('optgroup');
  og.label = s.id + ' - ' + plain(s.title);
  COURSES.forEach((c, ci) => {
    const o = document.createElement('option');
    o.value = String(NP + si * COURSES.length + ci);
    o.textContent = s.id + ' · ' + c.title;
    og.appendChild(o);
  });
  jump.appendChild(og);
});
jump.addEventListener('change', e => go(parseInt(e.target.value, 10)));

$('play').addEventListener('click', e => {
  playing = !playing;
  const btn = e.currentTarget;
  btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  btn.querySelector('span').textContent = playing ? 'Stop' : 'Play';
  clearInterval(playTimer);
  if (playing) playTimer = setInterval(() => go(idx + 1), 8000);
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(idx + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(idx - 1); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(SLIDES.length - 1);
});

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const now = performance.now();
  if (now - wheelLock < 320) return;
  wheelLock = now;
  go(idx + (e.deltaY > 0 || e.deltaX > 0 ? 1 : -1));
}, {passive: false});

let touchX = null;
stage.addEventListener('pointerdown', e => { touchX = e.clientX; });
stage.addEventListener('pointerup', e => {
  if (touchX === null) return;
  const dx = e.clientX - touchX;
  if (Math.abs(dx) > 46) go(idx + (dx < 0 ? 1 : -1));
  touchX = null;
});
stage.addEventListener('pointermove', e => {
  const r = band.getBoundingClientRect();
  mx = ((e.clientX - r.left) / r.width) * RW;
  my = ((e.clientY - r.top) / r.height) * RH;
  mh = 1.2; pointerAt = performance.now();
}, {passive: true});

window.addEventListener('resize', () => { layout(); });

/* ---------- boot ---------- */
const fromHash = parseInt((location.hash || '').replace('#', ''), 10);
if (!isNaN(fromHash)) idx = Math.min(Math.max(fromHash - 1, 0), SLIDES.length - 1);
layout();
update(false);
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLogo);
</script>
</body>
</html>
